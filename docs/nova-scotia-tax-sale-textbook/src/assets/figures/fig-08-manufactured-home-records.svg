<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 482" width="672" height="482" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>One listing, four separate records</title><desc>The home, the land, the space and security interests are separate questions.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="482" fill="#ffffff"/><rect x="8" y="8" width="272" height="112" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="8" y="8" width="272" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="20" y="36" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">The home</text>
<text x="20" y="52.9" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Mobile-home tax-sale regulations and</text>
<text x="20" y="68.5" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">prescribed forms</text>
<text x="20" y="86.1" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The notice uses a mobile home identifier.</text>
<rect x="392" y="8" width="272" height="112" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="392" y="8" width="272" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="404" y="36" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">The land under it</text>
<text x="404" y="52.9" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Land records</text>
<text x="404" y="70.5" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The map selects the underlying land PID.</text>
<rect x="8" y="250" width="272" height="124" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="8" y="250" width="272" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="20" y="278" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">The right to keep the home on the</text>
<text x="20" y="294.9" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">space</text>
<text x="20" y="311.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Land-lease community: the Residential</text>
<text x="20" y="327.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Tenancies framework</text>
<text x="20" y="345" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">Rules about the space, the tenancy and the</text>
<text x="20" y="360.6" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">sale of a home that remains there.</text>
<rect x="392" y="250" width="272" height="124" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="392" y="250" width="272" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="404" y="278" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Security interests in the home</text>
<text x="404" y="294.9" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Personal Property Registry</text>
<text x="404" y="312.5" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">Not the land registry. A clean-looking PID</text>
<text x="404" y="328.1" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">search does not answer it.</text>
<rect x="214" y="130" width="244" height="110" rx="3" fill="#e6eef0" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="442" cy="146" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="442" y="150" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="336" y="154" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">Fictional Harbour Park listing</text>
<text x="336" y="170" font-size="11" font-weight="400" fill="#4a4843" text-anchor="middle">Composite — not a real property</text>
<text x="336" y="196" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="middle">Asset identity unresolved</text>
<text x="336" y="214" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">No PID-only conclusion</text>
<text x="228" y="234" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Roadside view: a home on a serviced pad.</text>
<rect x="8" y="386" width="656" height="88" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="20" y="408" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">None of the notice, the map or the roadside view establishes that:</text>
<text x="20" y="432" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="32" y="432" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the home and land share an owner</text>
<text x="236" y="432" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="248" y="432" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the home is affixed to the land</text>
<text x="452" y="432" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="464" y="432" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the pad agreement transfers</text>
<text x="20" y="456" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="32" y="456" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">a personal-property lien is absent</text>
<text x="236" y="456" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="248" y="456" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the home can remain after a sale</text></svg>
