<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 300" width="672" height="300" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Surplus follows a statutory route</title><desc>Purchase money, statutory applications, balance to the surplus account, then two branches.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="300" fill="#ffffff"/><rect x="8" y="12" width="200" height="76" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="35" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Purchase money</text>
<text x="20" y="55" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Amount received at the tax sale</text>
<path d="M208,50 L233,50" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="236" y="12" width="200" height="76" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="248" y="35" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Statutory applications</text>
<text x="248" y="55" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Taxes, interest, sale expenses</text>
<text x="248" y="70.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and specified municipal amounts</text>
<path d="M436,50 L461,50" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="464" y="12" width="200" height="76" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="476" y="35" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Balance to surplus</text>
<text x="476" y="55" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Held in the tax-sale surplus</text>
<text x="476" y="70.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">account</text>
<line x1="564" y1="88" x2="564" y2="114" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="158" y1="114" x2="564" y2="114" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M158,114 L158,135" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M514,114 L514,135" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="8" y="138" width="300" height="82" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="158" y="162" font-size="13" font-weight="700" fill="#1f5560" text-anchor="middle">If redeemed</text>
<text x="158" y="184" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">The balance reduces the redemption amount under</text>
<text x="158" y="199.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">the statutory formula.</text>
<rect x="364" y="138" width="300" height="82" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="514" y="162" font-size="13" font-weight="700" fill="#1f5560" text-anchor="middle">After redemption expires</text>
<text x="514" y="184" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">A prior interest holder may apply to Supreme Court</text>
<text x="514" y="199.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">for a proportional payment before 20 years pass.</text>
<rect x="8" y="252" width="656" height="40" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="276.5" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">No automatic payout · no purchaser windfall · court route and deadlines matter</text></svg>
