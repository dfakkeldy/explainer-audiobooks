<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 496" width="672" height="496" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Two ledgers for one redemption</title><desc>Categories of the redemption amount and of the purchaser repayment.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="496" fill="#ffffff"/><rect x="8" y="8" width="400" height="62" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="20" y="32" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">Redemption amount</text>
<text x="20" y="52" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">The treasurer determines it through the statutory process.</text>
<rect x="432" y="8" width="232" height="62" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="444" y="32" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">Purchaser repayment</text>
<text x="444" y="52" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">The statute's repayment section</text>
<line x1="8" y1="114" x2="408" y2="114" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="101" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="100.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The sum the purchaser paid</text>
<line x1="432" y1="114" x2="664" y2="114" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="448" y="101" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="464" y="100.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Purchase sum</text>
<line x1="412" y1="96" x2="428" y2="96" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="8" y1="150" x2="408" y2="150" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="137" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="128.7" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Interest at 10% a year on the total paid, from sale date to</text>
<text x="40" y="144.3" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption date</text>
<line x1="432" y1="150" x2="664" y2="150" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="448" y="137" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="464" y="136.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Interest</text>
<line x1="412" y1="132" x2="428" y2="132" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="8" y1="186" x2="408" y2="186" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="173" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="172.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Certain older unpaid taxes the purchase payment did not cover</text>
<line x1="432" y1="186" x2="664" y2="186" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<line x1="8" y1="222" x2="408" y2="222" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="209" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="208.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Taxes levied after the sale, and related interest</text>
<line x1="432" y1="222" x2="664" y2="222" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<line x1="8" y1="258" x2="408" y2="258" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="245" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="244.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The fee to record the discharge</text>
<line x1="432" y1="258" x2="664" y2="258" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<line x1="8" y1="294" x2="408" y2="294" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="281" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="280.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Qualifying fire-insurance premiums</text>
<line x1="432" y1="294" x2="664" y2="294" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="448" y="281" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="464" y="280.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Fire-insurance premiums</text>
<line x1="412" y1="276" x2="428" y2="276" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="8" y1="330" x2="408" y2="330" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="317" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="40" y="316.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Necessary repairs paid with the treasurer's written approval</text>
<line x1="432" y1="330" x2="664" y2="330" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="448" y="317" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">+</text>
<text x="464" y="316.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Approved repairs</text>
<line x1="412" y1="312" x2="428" y2="312" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<rect x="8" y="330" width="400" height="36" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<line x1="8" y1="366" x2="408" y2="366" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="353" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">−</text>
<text x="40" y="352.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Less: any balance in the tax-sale surplus account for the property</text>
<line x1="432" y1="366" x2="664" y2="366" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<rect x="8" y="366" width="400" height="36" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<line x1="8" y1="402" x2="408" y2="402" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="389" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">−</text>
<text x="40" y="388.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Less: rent or other income earned by the purchaser from the land</text>
<line x1="432" y1="402" x2="664" y2="402" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<rect x="432" y="366" width="232" height="36" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="448" y="389" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">−</text>
<text x="464" y="388.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Less: rent or other property income</text>
<line x1="412" y1="384" x2="428" y2="384" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
<line x1="8" y1="78" x2="408" y2="78" stroke="#1d1c1a" stroke-width="1" stroke-linecap="butt"/>
<line x1="432" y1="78" x2="664" y2="78" stroke="#1d1c1a" stroke-width="1" stroke-linecap="butt"/>
<text x="432" y="416" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Not necessarily the same</text>
<text x="432" y="430" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">line-by-line list.</text>
<rect x="8" y="440" width="656" height="48" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="460.7" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">From the time the full redemption amount is paid to the treasurer, the purchaser ceases to have a right to the</text>
<text x="336" y="476.3" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">land.</text></svg>
