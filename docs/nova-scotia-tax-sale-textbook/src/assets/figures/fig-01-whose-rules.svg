<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 352" width="672" height="352" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Whose rules answer which question</title><desc>Three tiers: provincial law, municipal practice, the current event notice.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="352" fill="#ffffff"/><rect x="8" y="8" width="512" height="104" rx="0" fill="#e6eef0" stroke="#cfcac0" stroke-width="0.75"/>
<text x="20" y="32" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Provincial law</text>
<text x="20" y="52" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Why a sale can occur</text>
<rect x="8" y="124" width="512" height="100" rx="0" fill="#f3f1ec" stroke="#cfcac0" stroke-width="0.75"/>
<text x="20" y="148" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Municipal practice</text>
<text x="20" y="168" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">How a municipality</text>
<text x="20" y="183.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">operates inside that</text>
<text x="20" y="199.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">frame</text>
<rect x="8" y="236" width="512" height="108" rx="0" fill="#ffffff" stroke="#cfcac0" stroke-width="0.75"/>
<text x="20" y="260" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Current event notice</text>
<text x="20" y="280" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Whether this sale is</text>
<text x="20" y="295.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">happening, in what</text>
<text x="20" y="311.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">form, under which local</text>
<text x="20" y="326.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">instructions</text>
<rect x="170" y="30" width="164" height="76" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="170" y="30" width="6" height="76" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="186" y="54" font-size="12" font-weight="700" fill="#24395a" text-anchor="start">Municipal Government</text>
<text x="186" y="69.6" font-size="12" font-weight="700" fill="#24395a" text-anchor="start">Act</text>
<text x="186" y="87.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Outside Halifax</text>
<rect x="344" y="30" width="164" height="76" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="344" y="30" width="6" height="76" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="360" y="54" font-size="12" font-weight="700" fill="#24395a" text-anchor="start">Halifax Regional</text>
<text x="360" y="69.6" font-size="12" font-weight="700" fill="#24395a" text-anchor="start">Municipality Charter</text>
<text x="360" y="87.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Halifax</text>
<text x="170" y="150" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Example:</text>
<text x="225.57" y="150" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Inverness and Chester describe accounts as eligible</text>
<text x="225.57" y="165.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">after two years.</text>
<text x="170" y="191.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Example:</text>
<text x="225.57" y="191.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Halifax lists possible sale-expense categories: an</text>
<text x="225.57" y="206.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">example, not a price list.</text>
<rect x="170" y="262" width="338" height="56" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="2.25"/>
<text x="184" y="286" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">The current notice of the municipality running the</text>
<text x="184" y="301.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">event</text>
<text x="536" y="258" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">For a live event, the</text>
<text x="536" y="273.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">current notice of the</text>
<text x="536" y="289.2" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">municipality running it</text>
<text x="536" y="304.8" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">controls.</text>
