<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 412" width="672" height="412" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>A negative search has a beam</title><desc>A flashlight beam covers part of a dark field; hazards outside it remain unknown.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="412" fill="#ffffff"/><rect x="8" y="8" width="656" height="220" rx="0" fill="#1d1c1a" stroke="none" stroke-width="1.5"/>
<rect x="22" y="106" width="46" height="24" rx="3" fill="#6b6a66" stroke="#ffffff" stroke-width="1"/>
<path d="M68,102 L80,96 L80,140 L68,134 Z" fill="#6b6a66" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
<path d="M80,98 L470,30 L470,206 L80,138 Z" fill="#ffffff" fill-opacity="0.92" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="270" y="104" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">The source's coverage</text>
<text x="200" y="124" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">It can reveal a post, a stair or</text>
<text x="200" y="139.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">clear floor in the area it</text>
<text x="200" y="155.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">illuminates.</text>
<text x="462" y="172" font-size="11" font-weight="400" fill="#4a4843" text-anchor="end">time · location · record type</text>
<circle cx="540" cy="70" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<text x="540" y="74" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<circle cx="600" cy="150" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<text x="600" y="154" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<circle cx="520" cy="190" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<text x="520" y="194" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<circle cx="130" cy="56" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<text x="130" y="60" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<circle cx="240" cy="200" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
<text x="240" y="204" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<text x="500" y="104" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Outside the beam:</text>
<text x="500" y="119.6" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">hazards remain unknown.</text>
<rect x="8" y="244" width="155" height="100" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="268" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Time</text>
<text x="20" y="290" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Was the relevant period</text>
<text x="20" y="305.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">included?</text>
<rect x="175" y="244" width="155" height="100" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="187" y="268" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Place</text>
<text x="187" y="290" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Was the parcel inside</text>
<text x="187" y="305.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the source's mapped</text>
<text x="187" y="321.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">coverage?</text>
<rect x="342" y="244" width="155" height="100" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="354" y="268" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Record type</text>
<text x="354" y="290" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Would this source</text>
<text x="354" y="305.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">contain the event or</text>
<text x="354" y="321.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">condition?</text>
<rect x="509" y="244" width="155" height="100" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="521" y="268" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Match rule</text>
<text x="521" y="290" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Could spelling,</text>
<text x="521" y="305.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">geometry or identifiers</text>
<text x="521" y="321.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">hide a record?</text>
<text x="8" y="370" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">No result means only that this search, in this source, found no matching record.</text>
<text x="8" y="394" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">Limit of the picture: a public database's beam is not random, and different sources are not equally weak.</text></svg>
