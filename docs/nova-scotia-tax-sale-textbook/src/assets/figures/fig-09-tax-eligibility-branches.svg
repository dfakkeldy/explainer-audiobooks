<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 472" width="672" height="472" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Four branches before the ceiling</title><desc>Four tax and eligibility questions, each with its dated fact, as of July 2026.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="472" fill="#ffffff"/><rect x="8" y="10" width="320" height="186" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="34" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">1  Municipal deed transfer tax</text>
<circle cx="310" cy="29" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="310" y="33" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="20" y="56" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Does the municipal tax-sale-deed exemption apply</text>
<text x="20" y="71.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">to this deed?</text>
<line x1="20" y1="81.2" x2="316" y2="81.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="20" y="99.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The Municipal Government Act exempts a deed given</text>
<text x="20" y="114.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">pursuant to a tax sale from municipal deed transfer tax.</text>
<text x="20" y="130.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Registration charges, HST, the provincial non-resident</text>
<text x="20" y="146" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">tax, income-tax consequences and advice remain.</text>
<rect x="344" y="10" width="320" height="186" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="356" y="34" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">2  Provincial non-resident tax</text>
<circle cx="646" cy="29" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="33" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="356" y="56" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Could the provincial non-resident tax apply to this</text>
<text x="356" y="71.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">buyer and property?</text>
<line x1="356" y1="81.2" x2="652" y2="81.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="356" y="99.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">For qualifying transfers after March 2025: a 10% rate</text>
<text x="356" y="114.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">based on the non-resident interest and the higher of</text>
<text x="356" y="130.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">purchase price or assessed value, subject to definitions</text>
<text x="356" y="146" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and exemptions (one concerns moving to Nova Scotia</text>
<text x="356" y="161.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">within six months).</text>
<rect x="8" y="210" width="320" height="186" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="234" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">3  HST</text>
<circle cx="310" cy="229" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="310" y="233" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="20" y="256" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">What is the HST treatment of this particular</text>
<text x="20" y="271.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">transaction?</text>
<line x1="20" y1="281.2" x2="316" y2="281.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="20" y="299.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">CBRM's current event instructions: HST applies to</text>
<text x="20" y="314.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">vacant land and commercially assessed property. That</text>
<text x="20" y="330.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">is a CBRM rule, not a universal one. Canada Revenue</text>
<text x="20" y="346" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Agency guidance: treatment can depend on the seller,</text>
<text x="20" y="361.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">prior use, property, transaction and purchaser's</text>
<text x="20" y="377.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">registration status.</text>
<rect x="344" y="210" width="320" height="186" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="356" y="234" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">4  Eligibility</text>
<circle cx="646" cy="229" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="233" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="356" y="256" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Is the buyer eligible under current federal,</text>
<text x="356" y="271.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">provincial, and municipal law?</text>
<line x1="356" y1="281.2" x2="652" y2="281.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="356" y="299.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Eligibility comes before price. The federal prohibition</text>
<text x="356" y="314.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">on certain purchases of residential property by</text>
<text x="356" y="330.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">non-Canadians is currently scheduled through January</text>
<text x="356" y="346" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">1, 2027.</text>
<rect x="8" y="416" width="656" height="46" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="20" y="435" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">An unanswered branch does not automatically mean no bid.</text>
<text x="20" y="452" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The file is not ready until the effect is confirmed, bounded, or treated as a stop condition.</text></svg>
