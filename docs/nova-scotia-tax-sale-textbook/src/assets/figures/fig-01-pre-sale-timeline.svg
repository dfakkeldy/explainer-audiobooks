<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 470" width="672" height="470" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>From unpaid taxes to sale day</title><desc>Timeline, not to scale, of the steps before a tax sale outside Halifax.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-24395a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#24395a"/></marker></defs><rect width="672" height="470" fill="#ffffff"/><rect x="8" y="8" width="656" height="28" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="18" y="27" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Outside Halifax: Municipal Government Act</text>
<text x="654" y="27" font-size="12" font-weight="400" fill="#4a4843" text-anchor="end">Halifax: parallel framework under its Charter</text>
<text x="18" y="64" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">1  Arrears and eligibility</text>
<line x1="20" y1="110" x2="640" y2="110" stroke="#24395a" stroke-width="2.25" stroke-linecap="butt"/>
<path d="M630,110 L654,110" fill="none" stroke="#24395a" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-24395a)"/>
<circle cx="30" cy="110" r="6" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="24" y="138" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Taxes unpaid</text>
<text x="24" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A tax lien attaches. It ranks</text>
<text x="24" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">ahead of other claims, liens and</text>
<text x="24" y="187.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">encumbrances and need not be</text>
<text x="24" y="202.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">registered.</text>
<circle cx="250" cy="110" r="6" fill="#ffffff" stroke="#24395a" stroke-width="2.25"/>
<text x="244" y="138" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Earliest start</text>
<text x="244" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">For taxes unpaid from the</text>
<text x="244" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">immediately preceding taxation</text>
<text x="244" y="187.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">year: not before June 30 of the</text>
<text x="244" y="202.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">following year.</text>
<circle cx="470" cy="110" r="6" fill="#ffffff" stroke="#24395a" stroke-width="2.25"/>
<text x="464" y="138" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Backstop</text>
<text x="464" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Must be put up for sale once</text>
<text x="464" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">taxes are unpaid for the three</text>
<text x="464" y="187.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">preceding fiscal years, subject to</text>
<text x="464" y="202.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the Act’s exceptions and a</text>
<text x="464" y="218.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">possible council deferral.</text>
<line x1="360" y1="84" x2="360" y2="106" stroke="#4a4843" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="2 2"/>
<text x="360" y="64" font-size="11" font-weight="400" fill="#4a4843" text-anchor="middle">Inverness and Chester: eligible</text>
<text x="360" y="78" font-size="11" font-weight="400" fill="#4a4843" text-anchor="middle">after two years (municipal practice)</text>
<text x="18" y="252" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">2  Notices and sale</text>
<line x1="20" y1="340" x2="548" y2="340" stroke="#24395a" stroke-width="2.25" stroke-linecap="butt"/>
<path d="M540,340 L562,340" fill="none" stroke="#24395a" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-24395a)"/>
<circle cx="30" cy="340" r="6" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="24" y="368" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Preliminary notice</text>
<text x="24" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Sent by the</text>
<text x="24" y="401.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">municipality</text>
<circle cx="160" cy="340" r="6" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="154" y="368" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Title search</text>
<text x="154" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Helps identify owner</text>
<text x="154" y="401.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and interest holders;</text>
<text x="154" y="417.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">may order a survey</text>
<circle cx="290" cy="340" r="6" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="284" y="368" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Notice of intent</text>
<text x="284" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">To the owner and</text>
<text x="284" y="401.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">people with</text>
<text x="284" y="417.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">mortgages, liens or</text>
<text x="284" y="432.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">charges</text>
<circle cx="420" cy="340" r="6" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="414" y="368" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Public notice</text>
<text x="414" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Qualifying newspaper</text>
<text x="414" y="401.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">or the municipal</text>
<text x="414" y="417.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">website</text>
<rect x="566" y="322" width="98" height="36" rx="3" fill="#24395a" stroke="#24395a" stroke-width="1.5"/>
<text x="615" y="345" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Sale</text>
<text x="566" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Public auction, or</text>
<text x="566" y="401.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">tender with</text>
<text x="566" y="417.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">council’s consent</text>
<text x="566" y="440" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Bidders enter</text>
<text x="566" y="455.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">after notices</text>
<path d="M30,317 L30,310 L160,310 L160,317" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round"/>
<text x="95" y="304" font-size="12" font-weight="700" fill="#1f5560" text-anchor="middle">at least 14 days to pay</text>
<path d="M290,279 L290,272 L566,272 L566,279" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round"/>
<text x="428" y="266" font-size="12" font-weight="700" fill="#1f5560" text-anchor="middle">60 days to pay before the sale</text>
<path d="M420,317 L420,310 L566,310 L566,317" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round"/>
<text x="493" y="304" font-size="12" font-weight="700" fill="#1f5560" text-anchor="middle">at least 30 consecutive days</text>
<text x="18" y="458" font-size="11" font-weight="700" fill="#6b6a66" text-anchor="start">Not to scale</text></svg>
