<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 510" width="672" height="510" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>What can happen to a listed property at a sale</title><desc>A spine of states from advertised to certificate of sale, with a dashed branch at each point where the expected sale can stop.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker><marker id="arrow-6b6a66" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b6a66"/></marker></defs><rect width="672" height="510" fill="#ffffff"/><rect x="8" y="22.6" width="206" height="46" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="43.6" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Advertised</text>
<text x="20" y="59.6" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Before the event</text>
<rect x="262" y="10" width="402" height="71.2" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="31" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Withdrawn</text>
<text x="274" y="49" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Paid, removed or otherwise changed. Check the current municipal</text>
<text x="274" y="64.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source; research cannot turn it into a private offer.</text>
<path d="M214,45.6 L259,45.6" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-6b6a66)"/>
<rect x="8" y="123.4" width="206" height="46" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="144.4" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Called</text>
<text x="20" y="160.4" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">During the event</text>
<rect x="262" y="95.2" width="402" height="102.4" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="116.2" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">No sufficient bid</text>
<text x="274" y="134.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Treasurer may buy for the municipality, or the municipality may</text>
<text x="274" y="149.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">advertise again and later sell at auction or by highest tender, subject to</text>
<text x="274" y="165.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">any acceptable minimum directed by council. Unsold is not privately</text>
<text x="274" y="181" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">available (CBRM legend: only at a future tax sale).</text>
<path d="M214,146.4 L259,146.4" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-6b6a66)"/>
<rect x="8" y="224.2" width="206" height="46" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="245.2" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Leading offer</text>
<text x="20" y="261.2" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Highest acceptable bid</text>
<rect x="262" y="211.6" width="402" height="71.2" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="232.6" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Immediate payment fails</text>
<text x="274" y="250.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Land is put up for sale again at once. The next person does not</text>
<text x="274" y="266.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">automatically inherit the winning amount.</text>
<path d="M214,247.2 L259,247.2" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-6b6a66)"/>
<rect x="8" y="309.4" width="206" height="46" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="330.4" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Immediate amount paid</text>
<text x="20" y="346.4" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Price or recovery amount</text>
<rect x="262" y="296.8" width="402" height="71.2" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="317.8" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Balance not paid</text>
<text x="274" y="335.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Land is re-advertised and sold. Resale expenses are deducted from the</text>
<text x="274" y="351.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">deposit; the remainder is refunded after the resale.</text>
<path d="M214,332.4 L259,332.4" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-6b6a66)"/>
<rect x="8" y="382" width="206" height="46" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="403" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Balance paid</text>
<text x="20" y="419" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Within 3 business days</text>
<rect x="8" y="442" width="206" height="46" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="2.25"/>
<path d="M20,459.0 L23.5,463.0 L30.5,455.0" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="38" y="463" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">Certificate of sale</text>
<text x="20" y="479" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Redeemable branch</text>
<path d="M111,68.6 L111,120.4" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M111,169.4 L111,221.2" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M111,270.2 L111,306.4" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M111,355.4 L111,379" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M111,428 L111,439" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="262" y="382" width="194" height="118" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="403" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Tender</text>
<text x="274" y="421" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The accepted tenderer has</text>
<text x="274" y="436.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">three business days after</text>
<text x="274" y="452.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">notification to pay. Failure</text>
<text x="274" y="467.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">sends the land back toward</text>
<text x="274" y="483.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">advertisement and sale.</text>
<rect x="470" y="382" width="194" height="118" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="482" y="403" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Schedule change</text>
<text x="482" y="421" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">An old advertisement cannot</text>
<text x="482" y="436.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">prove the changed event.</text>
<text x="482" y="452.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Return to the municipal page</text>
<text x="482" y="467.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and current notice.</text></svg>
