<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 402" width="672" height="402" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Exposure and the maximum, kept apart</title><desc>Panel a: $30,000 bid + $40,000 known non-bid costs + $20,000 uncertainty reserve = $90,000 all-in exposure. Panel b: supported value boundary minus known non-bid costs and reserve leaves what can become the maximum bid.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="402" fill="#ffffff"/><text x="16" y="24" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">a  All-in exposure (worked example, fictional file)</text>
<rect x="16" y="40" width="210.33" height="40" rx="0" fill="#1f5560" stroke="#1f5560" stroke-width="1.5"/>
<text x="26" y="58" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">$30,000</text>
<text x="26" y="73" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">bid</text>
<rect x="229.33" y="40" width="281.44" height="40" rx="0" fill="#9db8bf" stroke="#1f5560" stroke-width="1.5"/>
<text x="239.33" y="58" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">$40,000</text>
<text x="239.33" y="73" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">known non-bid costs</text>
<rect x="513.78" y="40" width="139.22" height="40" rx="0" fill="#ffffff" stroke="#1f5560" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="523.78" y="58" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">$20,000</text>
<text x="523.78" y="73" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">uncertainty reserve</text>
<path d="M16,88 L16,94 L653,94 L653,88" fill="none" stroke="#1d1c1a" stroke-width="1.25" stroke-linejoin="round"/>
<text x="336" y="112" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">$90,000 all-in exposure</text>
<text x="336" y="128" font-size="11" font-weight="400" fill="#4a4843" text-anchor="middle">Keep the structure, not the total: bid, known costs, reserve.</text>
<line x1="16" y1="158" x2="656" y2="158" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="16" y="184" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">b  The maximum, built backward (no amounts; not to scale)</text>
<rect x="16" y="198" width="640" height="40" rx="0" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="26" y="216" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Supported value boundary</text>
<text x="26" y="231" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">highest all-in amount defensible for the stated use, from property-specific valuation evidence</text>
<path d="M336,242 L336,263" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<text x="346" y="258" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">subtract from the right</text>
<rect x="16" y="268" width="237" height="40" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="2.25"/>
<text x="26" y="286" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">What remains</text>
<text x="26" y="301" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">can become the maximum bid</text>
<rect x="256" y="268" width="237" height="40" rx="0" fill="#9db8bf" stroke="#1f5560" stroke-width="1.5"/>
<text x="266" y="286" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Known non-bid costs</text>
<rect x="496" y="268" width="157" height="40" rx="0" fill="#ffffff" stroke="#1f5560" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="506" y="286" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Uncertainty reserve</text>
<path d="M19,330 L22.5,334 L29.5,326" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="38" y="334" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Only if every essential legal, eligibility, payment and no-go condition is satisfied, and the amount is fundable.</text>
<rect x="16" y="356" width="640" height="34" rx="0" fill="#f6e8e3" stroke="#a33b28" stroke-width="3"/>
<rect x="27" y="371" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="50" y="378" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">If costs and reserve consume the whole boundary, nothing remains: a no-bid result.</text></svg>
