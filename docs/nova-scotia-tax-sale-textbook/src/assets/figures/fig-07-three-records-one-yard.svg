<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 464" width="672" height="464" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Three records beneath one yard</title><desc>Four records under one fictional yard, each with its result type and limit.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="464" fill="#ffffff"/><rect x="8" y="8" width="656" height="104" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="8" y="112" width="656" height="18" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<line x1="8" y1="112" x2="664" y2="112" stroke="#6b6a66" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M110,112 L110,66 L160,42 L210,66 L210,112 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round"/>
<text x="160" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">building</text>
<text x="486" y="24" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Fictional Breakwater Lane yard</text>
<text x="486" y="40" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Composite — not a real property</text>
<text x="486" y="56" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Pre-bid records only; no entry</text>
<circle cx="418" cy="106" r="5" fill="none" stroke="#7a3e6e" stroke-width="2"/>
<text x="418" y="94" font-size="11" font-weight="400" fill="#4a4843" text-anchor="middle">well point (estimated)</text>
<rect x="8" y="152" width="152" height="228" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="18" y="174" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Former-use history</text>
<text x="18" y="192.9" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Positive clue</text>
<text x="18" y="212.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Expands environmental</text>
<text x="18" y="228.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">inquiry: fuel, solvents,</text>
<text x="18" y="244.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">waste handling, fill, prior</text>
<text x="18" y="259.7" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">spills.</text>
<line x1="18" y1="271.3" x2="150" y2="271.3" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="18" y="287.3" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="18" y="303.3" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Does not establish a</text>
<text x="18" y="318.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">spill, contaminant, tank</text>
<text x="18" y="334.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">location or present</text>
<text x="18" y="350.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">condition.</text>
<rect x="175.33" y="152" width="152" height="228" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5"/>
<text x="185.33" y="174" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Contaminated-site</text>
<text x="185.33" y="190.9" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">search</text>
<text x="185.33" y="209.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Bounded negative</text>
<text x="185.33" y="229.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">No parcel-specific</text>
<text x="185.33" y="245.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record located under the</text>
<text x="185.33" y="261" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">recorded search method</text>
<text x="185.33" y="276.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and date.</text>
<line x1="185.33" y1="288.2" x2="317.33" y2="288.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="185.33" y="304.2" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="185.33" y="320.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Reporting and search</text>
<text x="185.33" y="335.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">limits: not a clean site or</text>
<text x="185.33" y="351.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">a complete reporting</text>
<text x="185.33" y="367" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">history.</text>
<rect x="342.66" y="152" width="152" height="228" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="480.66" cy="168" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="480.66" y="172" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="352.66" y="174" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Well log</text>
<text x="352.66" y="192.9" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">Positive record</text>
<text x="352.66" y="212.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">One estimated point</text>
<text x="352.66" y="228.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">near the parcel; the log</text>
<text x="352.66" y="244.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">describes depth and a</text>
<text x="352.66" y="259.7" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">reported yield.</text>
<line x1="352.66" y1="271.3" x2="484.66" y2="271.3" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="352.66" y="287.3" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="352.66" y="303.3" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Parcel association,</text>
<text x="352.66" y="318.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">geolocation and present</text>
<text x="352.66" y="334.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">condition are uncertain.</text>
<rect x="509.99" y="152" width="152" height="228" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5"/>
<text x="519.99" y="174" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">On-site sewage</text>
<text x="519.99" y="190.9" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">search</text>
<text x="519.99" y="209.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Negative result</text>
<text x="519.99" y="229.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">No older on-site sewage</text>
<text x="519.99" y="245.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record returned.</text>
<line x1="519.99" y1="257" x2="651.99" y2="257" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="519.99" y="273" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="519.99" y="289" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Retention boundary is</text>
<text x="519.99" y="304.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">central: a record is</text>
<text x="519.99" y="320.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">unlikely for a property</text>
<text x="519.99" y="335.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">more than seven years</text>
<text x="519.99" y="351.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">old.</text>
<rect x="8" y="398" width="656" height="56" rx="0" fill="#f6e8e3" stroke="none" stroke-width="1.5"/>
<text x="24" y="432" font-size="18" font-weight="700" fill="#a33b28" text-anchor="start">No · yes · no</text>
<line x1="20" y1="426" x2="133.62" y2="426" stroke="#a33b28" stroke-width="2.25" stroke-linecap="butt"/>
<text x="157.62" y="422" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Flattening the records this way creates misleading symmetry. Classify each result with</text>
<text x="157.62" y="437.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">its limit instead.</text></svg>
