<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 340" width="672" height="340" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Case B: occupation proves neither use nor services</title><desc>Parcel B with zones, water and sewer lines, a use-confirmation icon and an occupancy warning.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="340" fill="#ffffff"/><defs><pattern id="hatch-zone-b" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f6b6e" stroke-width="1" stroke-opacity="0.35"/></pattern></defs>
