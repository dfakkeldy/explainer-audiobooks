<text x="328" y="51" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">Zone ?</text>
<rect x="147" y="242.95" width="56.74" height="14.95" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="150" y="254" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Parcel B</text>
