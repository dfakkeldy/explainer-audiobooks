<text x="270" y="144" font-size="11" font-weight="700" fill="#1f6b6e" text-anchor="middle">?</text>
<rect x="168.96" y="102.65" width="122.08" height="12.65" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="230" y="112" font-size="11" font-weight="700" fill="#1f6b6e" text-anchor="middle">use: confirm in writing</text>
<rect x="300" y="196" width="120" height="72" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="310" y="214" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">Occupancy</text>
<text x="310" y="230" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">Existing occupation</text>
<text x="310" y="244.3" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">does not prove</text>
<text x="310" y="258.6" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">vacant possession.</text>
<line x1="300" y1="216" x2="252" y2="190" stroke="#7a3e6e" stroke-width="1.25" stroke-linecap="butt" stroke-dasharray="6 4"/>
