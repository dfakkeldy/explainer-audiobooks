<rect x="364.9" y="312.65" width="64.1" height="12.65" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="426" y="322" font-size="11" font-weight="400" fill="#4a4843" text-anchor="end">Not to scale</text>
<text x="8" y="19" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Composite — not a real property; not a survey.</text>
