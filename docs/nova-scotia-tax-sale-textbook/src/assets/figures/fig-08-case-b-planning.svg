<text x="460" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Confirm the current rule and</text>
<text x="460" y="91.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">intended use in writing.</text>
<rect x="448" y="133.33" width="216" height="93.33" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="460" y="158.33" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Frontage</text>
<text x="460" y="179.33" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Mapped contact is not a survey</text>
<text x="460" y="194.93" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">measurement.</text>
<rect x="448" y="236.67" width="216" height="93.33" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="460" y="261.67" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Services</text>
<circle cx="648" cy="256.67" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="648" y="260.67" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="460" y="282.67" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Well, septic, water and sewer</text>
<text x="460" y="298.27" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">require separate evidence.</text></svg>
