<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 400" width="672" height="400" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Authority depends on the question</title><desc>Five source cards, each with the question it can answer.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="400" fill="#ffffff"/><rect x="24" y="328" width="380" height="56" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="38" y="350" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Imagery</text>
<circle cx="45" cy="367" r="7" fill="#ffffff" stroke="#4a4843" stroke-width="1.25"/>
<text x="45" y="371" font-size="11" font-weight="700" fill="#4a4843" text-anchor="middle">?</text>
<text x="58" y="371" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What appeared visible on a dated image?</text>
<rect x="84" y="260" width="380" height="56" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="98" y="282" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Map layers</text>
<circle cx="105" cy="299" r="7" fill="#ffffff" stroke="#4a4843" stroke-width="1.25"/>
<text x="105" y="303" font-size="11" font-weight="700" fill="#4a4843" text-anchor="middle">?</text>
<text x="118" y="303" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Where should another record search begin?</text>
<rect x="144" y="192" width="380" height="56" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="144" y="192" width="6" height="56" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="162" y="214" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Municipal record</text>
<circle cx="169" cy="231" r="7" fill="#ffffff" stroke="#4a4843" stroke-width="1.25"/>
<text x="169" y="235" font-size="11" font-weight="700" fill="#4a4843" text-anchor="middle">?</text>
<text x="182" y="235" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What did this event publish?</text>
<rect x="204" y="124" width="380" height="56" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="218" y="146" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Registry / survey</text>
<circle cx="225" cy="163" r="7" fill="#ffffff" stroke="#4a4843" stroke-width="1.25"/>
<text x="225" y="167" font-size="11" font-weight="700" fill="#4a4843" text-anchor="middle">?</text>
<text x="238" y="167" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What legally identifies the interest and boundary?</text>
<rect x="264" y="56" width="380" height="56" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="278" y="78" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Governing law</text>
<circle cx="285" cy="95" r="7" fill="#ffffff" stroke="#4a4843" stroke-width="1.25"/>
<text x="285" y="99" font-size="11" font-weight="700" fill="#4a4843" text-anchor="middle">?</text>
<text x="298" y="99" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What process and powers apply?</text>
<path d="M420,384 L646.02,127.85" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<text x="460" y="368" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">From imagery and screening clues</text>
<text x="460" y="382" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">to governing law</text>
<text x="8" y="30" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">A stronger source is one authorized to</text>
<text x="8" y="45.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">answer the particular question — not</text>
<text x="8" y="61.2" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">simply one that looks official.</text></svg>
