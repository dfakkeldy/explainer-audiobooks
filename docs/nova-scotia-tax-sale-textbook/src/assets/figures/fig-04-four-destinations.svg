<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 573.2" width="672" height="573.2" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Four places an unknown can go</title><desc>Four questions in order, each leading to a destination, with Birch Point Road's entries.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker><marker id="arrow-1f6b6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6b6e"/></marker><marker id="arrow-7a3e6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a3e6e"/></marker><marker id="arrow-a33b28" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33b28"/></marker></defs><rect width="672" height="573.2" fill="#ffffff"/><rect x="8" y="8" width="196" height="30" rx="3" fill="#f3f1ec" stroke="#6b6a66" stroke-width="1"/>
<text x="106" y="28" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">An unknown in the file</text>
<path d="M106,38 L106,47" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<text x="664" y="28" font-size="11" font-weight="400" fill="#4a4843" text-anchor="end">Birch Point Road: composite — not a real property</text>
<rect x="8" y="50" width="196" height="91.2" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.25"/>
<text x="20" y="72" font-size="11" font-weight="700" fill="#1f5560" text-anchor="start">Question 1</text>
<text x="20" y="92" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">What does the file actually</text>
<text x="20" y="107.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">establish?</text>
<path d="M106,141.2 L106,152.2" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M208,95.6 L243,95.6" fill="none" stroke="#1f6b6e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<rect x="248" y="50" width="416" height="91.2" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="262" y="74" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Verified</text>
<path d="M639,69 L642.5,73 L649.5,65" fill="none" stroke="#1f6b6e" stroke-width="2.25" stroke-linejoin="round"/>
<text x="262" y="94" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The file has the source, date and captured record.</text>
<line x1="262" y1="103.6" x2="650" y2="103.6" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="262" y="121.6" font-size="12" font-weight="700" fill="#4a4843" text-anchor="start">Birch Point Road: </text>
<text x="363.21" y="121.6" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">the exact PID-to-notice match</text>
<rect x="8" y="155.2" width="196" height="106.8" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.25"/>
<text x="20" y="177.2" font-size="11" font-weight="700" fill="#1f5560" text-anchor="start">Question 2</text>
<text x="20" y="197.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Does the next gap belong to a</text>
<text x="20" y="212.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">named professional or</text>
<text x="20" y="228.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">source?</text>
<path d="M106,262 L106,273" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M208,208.6 L243,208.6" fill="none" stroke="#7a3e6e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-7a3e6e)"/>
<rect x="248" y="155.2" width="416" height="106.8" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="262" y="179.2" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Professionally verifiable</text>
<circle cx="644" cy="174.2" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="644" y="178.2" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="262" y="199.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A question, an evidence source and a competent route to an answer;</text>
<text x="262" y="214.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">not a promise of a favourable answer.</text>
<line x1="262" y1="224.4" x2="650" y2="224.4" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="262" y="242.4" font-size="12" font-weight="700" fill="#4a4843" text-anchor="start">Birch Point Road: </text>
<text x="363.21" y="242.4" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">the access question, by the lawyer and surveyor</text>
<rect x="8" y="276" width="196" height="106.8" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.25"/>
<text x="20" y="298" font-size="11" font-weight="700" fill="#1f5560" text-anchor="start">Question 3</text>
<text x="20" y="318" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Can a documented answer</text>
<text x="20" y="333.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">enter the budget?</text>
<path d="M106,382.8 L106,393.8" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M208,329.4 L243,329.4" fill="none" stroke="#1f5560" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="248" y="276" width="416" height="106.8" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="2"/>
<text x="262" y="300" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Priceable uncertainty</text>
<line x1="637" y1="295" x2="651" y2="295" stroke="#1f5560" stroke-width="1.75" stroke-linecap="butt"/>
<line x1="637" y1="290" x2="637" y2="300" stroke="#1f5560" stroke-width="1.75" stroke-linecap="butt"/>
<line x1="651" y1="290" x2="651" y2="300" stroke="#1f5560" stroke-width="1.75" stroke-linecap="butt"/>
<text x="262" y="320" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A documented amount or bounded range, without inventing a</text>
<text x="262" y="335.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">number. Priceable does not mean trivial.</text>
<line x1="262" y1="345.2" x2="650" y2="345.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="262" y="363.2" font-size="12" font-weight="700" fill="#4a4843" text-anchor="start">Birch Point Road: </text>
<text x="363.21" y="363.2" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">a survey quote</text>
<rect x="8" y="396.8" width="196" height="122.4" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.25"/>
<text x="20" y="418.8" font-size="11" font-weight="700" fill="#1f5560" text-anchor="start">Question 4</text>
<text x="20" y="438.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Can an essential gap be</text>
<text x="20" y="454.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">resolved or carried?</text>
<path d="M208,458 L243,458" fill="none" stroke="#a33b28" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-a33b28)"/>
<rect x="248" y="396.8" width="416" height="122.4" rx="3" fill="#f6e8e3" stroke="#a33b28" stroke-width="3"/>
<text x="262" y="420.8" font-size="13" font-weight="700" fill="#a33b28" text-anchor="start">No-go if not</text>
<rect x="637" y="413.8" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="262" y="440.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">“Do not proceed under these conditions.” Not a prediction that the</text>
<text x="262" y="456.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">land is bad.</text>
<line x1="262" y1="466" x2="650" y2="466" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="262" y="484" font-size="12" font-weight="700" fill="#4a4843" text-anchor="start">Birch Point Road: </text>
<text x="363.21" y="484" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">an essential site-condition question that cannot be</text>
<text x="363.21" y="499.6" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">answered lawfully before sale</text>
<rect x="8" y="533.2" width="656" height="32" rx="0" fill="#f6e8e3" stroke="none" stroke-width="1.5"/>
<rect x="19" y="547.2" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="42" y="554.2" font-size="13" font-weight="700" fill="#a33b28" text-anchor="start">Evidence is not a vote: one essential no-go governs the file.</text></svg>
