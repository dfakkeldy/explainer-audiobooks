<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 408" width="672" height="408" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>The ordinary redeemable route</title><desc>Full payment, certificate holder, six months, then redemption or the deed stage.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker><marker id="arrow-1f6b6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6b6e"/></marker><marker id="arrow-2f5e46" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f5e46"/></marker></defs><rect width="672" height="408" fill="#ffffff"/><line x1="12" y1="30" x2="660" y2="30" stroke="#7a3e6e" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="6 4"/>
<line x1="12" y1="22" x2="12" y2="38" stroke="#7a3e6e" stroke-width="2.25" stroke-linecap="butt"/>
<line x1="660" y1="22" x2="660" y2="38" stroke="#7a3e6e" stroke-width="2.25" stroke-linecap="butt"/>
<rect x="256.82" y="19" width="158.37" height="22" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="336" y="34" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="middle">Six months after the sale</text>
<text x="12" y="16" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Sale</text>
<rect x="8" y="56" width="196" height="104" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="56" width="6" height="104" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="82" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Full payment</text>
<text x="26" y="104" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Treasurer issues and registers</text>
<text x="26" y="119.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">certificate</text>
<rect x="238" y="56" width="196" height="104" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="252" y="82" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Certificate holder</text>
<text x="252" y="104" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Protect land • insure insurable</text>
<text x="252" y="119.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">buildings • keep records</text>
<rect x="468" y="56" width="196" height="104" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="482" y="82" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Six months</text>
<circle cx="646" cy="77" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="81" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="482" y="104" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Qualifying interests may</text>
<text x="482" y="119.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redeem through the treasurer</text>
<path d="M204,108 L235,108" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M434,108 L465,108" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<line x1="566" y1="160" x2="566" y2="186" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="166" y1="186" x2="566" y2="186" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<circle cx="566" cy="186" r="4" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<path d="M166,186 L166,213" fill="none" stroke="#2f5e46" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-2f5e46)"/>
<path d="M506,186 L506,213" fill="none" stroke="#1f6b6e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<rect x="8" y="216" width="316" height="134" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="1.5"/>
<path d="M25,237 L28.5,241 L35.5,233" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="46" y="242" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">If redeemed</text>
<text x="24" y="266" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Purchaser is repaid under the statutory formula.</text>
<text x="24" y="281.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Certificate-holder rights end.</text>
<line x1="24" y1="308" x2="308" y2="308" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="332" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Ends in repayment and discharge</text>
<rect x="348" y="216" width="316" height="134" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="364" y="242" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">If not redeemed</text>
<text x="364" y="266" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">After the applicable wait, purchaser may request and</text>
<text x="364" y="281.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">pay for the municipal deed.</text>
<line x1="364" y1="308" x2="648" y2="308" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="364" y="332" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Tax deed if no redemption occurs</text>
<rect x="8" y="364" width="656" height="34" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="336" y="386" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Certificate holder is a legal stage with powers, duties and limits — not ordinary ownership yet.</text></svg>
