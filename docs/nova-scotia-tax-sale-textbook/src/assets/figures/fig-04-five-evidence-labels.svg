<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 332" width="672" height="332" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Five labels keep claims honest</title><desc>Five evidence labels, from verified record to no-go until resolved.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="332" fill="#ffffff"/><rect x="10" y="12" width="236" height="46" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="28" y="40" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Verified record</text>
<path d="M221,35.0 L224.5,39.0 L231.5,31.0" fill="none" stroke="#1f6b6e" stroke-width="2.25" stroke-linejoin="round"/>
<line x1="254" y1="35" x2="272" y2="35" stroke="#cfcac0" stroke-width="1" stroke-linecap="butt"/>
<text x="282" y="40" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Directly supported by the cited source.</text>
<rect x="10" y="68" width="236" height="46" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="28" y="96" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Screening clue</text>
<line x1="254" y1="91" x2="272" y2="91" stroke="#cfcac0" stroke-width="1" stroke-linecap="butt"/>
<text x="282" y="96" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A map result that starts a question.</text>
<rect x="10" y="124" width="236" height="46" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="28" y="152" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Visual interpretation</text>
<line x1="254" y1="147" x2="272" y2="147" stroke="#cfcac0" stroke-width="1" stroke-linecap="butt"/>
<text x="282" y="152" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A dated observation, not a verified fact.</text>
<rect x="10" y="180" width="236" height="46" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="28" y="208" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Professional verification</text>
<circle cx="226" cy="203" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="226" y="207" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<line x1="254" y1="203" x2="272" y2="203" stroke="#cfcac0" stroke-width="1" stroke-linecap="butt"/>
<text x="282" y="208" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The question has reached an authorized expert.</text>
<rect x="10" y="236" width="236" height="46" rx="3" fill="#ffffff" stroke="#a33b28" stroke-width="3"/>
<text x="28" y="264" font-size="13" font-weight="700" fill="#a33b28" text-anchor="start">No-go until resolved</text>
<rect x="219" y="257" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<line x1="254" y1="259" x2="272" y2="259" stroke="#cfcac0" stroke-width="1" stroke-linecap="butt"/>
<text x="282" y="264" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The intended use cannot proceed on current evidence.</text>
<line x1="10" y1="294" x2="662" y2="294" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="10" y="316" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Good research labels the strength and authority of each observation.</text></svg>
