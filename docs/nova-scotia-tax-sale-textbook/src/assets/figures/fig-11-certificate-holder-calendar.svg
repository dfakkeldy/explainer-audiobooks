<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 322" width="672" height="322" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>The certificate-holder months are active</title><desc>Six month cards with recurring tasks; month 6 is unresolved.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="322" fill="#ffffff"/><rect x="8" y="10" width="208" height="118" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="8" y="10" width="208" height="5" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="20" y="38" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Month 1</text>
<text x="20" y="58" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Register certificate; organize</text>
<text x="20" y="73.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">evidence and insurance attempts.</text>
<rect x="20" y="100" width="87.58" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="27" y="112.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">record-keeping</text>
<rect x="113.58" y="100" width="60.86" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="120.58" y="112.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">insurance</text>
<rect x="232" y="10" width="208" height="118" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="232" y="10" width="208" height="5" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="244" y="38" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Month 2</text>
<text x="244" y="58" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Track new taxes, notices and</text>
<text x="244" y="73.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">protective-work records.</text>
<rect x="244" y="100" width="89.28" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="251" y="112.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">new-tax marker</text>
<rect x="456" y="10" width="208" height="118" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="456" y="10" width="208" height="5" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="468" y="38" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Month 3</text>
<text x="468" y="58" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Maintain lawful protection;</text>
<text x="468" y="73.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">preserve every receipt.</text>
<rect x="468" y="100" width="113.45" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="475" y="112.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">protective-work limit</text>
<rect x="8" y="142" width="208" height="118" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="8" y="142" width="208" height="5" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="20" y="170" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Month 4</text>
<text x="20" y="190" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Refresh status and keep the</text>
<text x="20" y="205.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption route open.</text>
<rect x="20" y="232" width="87.58" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="27" y="244.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">record-keeping</text>
<rect x="232" y="142" width="208" height="118" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="232" y="142" width="208" height="5" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="244" y="170" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Month 5</text>
<text x="244" y="190" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Prepare questions without</text>
<text x="244" y="205.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">assuming the outcome.</text>
<rect x="244" y="232" width="87.58" height="18" rx="2" fill="#ffffff" stroke="#9db8bf" stroke-width="1.2"/>
<text x="251" y="244.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">record-keeping</text>
<rect x="456" y="142" width="208" height="118" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="644" cy="162" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="644" y="166" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="468" y="170" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Month 6</text>
<text x="468" y="190" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Redemption may close the file;</text>
<text x="468" y="205.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">otherwise deed work begins.</text>
<rect x="468" y="232" width="142.95" height="18" rx="2" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="475" y="244.5" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">possible redemption event</text>
<rect x="8" y="274" width="656" height="40" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="298.5" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">The certificate-holder months are an operations period, not dead time.</text></svg>
