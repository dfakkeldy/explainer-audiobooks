<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 424" width="672" height="424" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Two catalogue keys and a pointer</title><desc>AAN and PID open different records; a civic address points to a place.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="424" fill="#ffffff"/><circle cx="30" cy="36" r="11" fill="#ffffff" stroke="#1f5560" stroke-width="3"/>
<line x1="41" y1="36" x2="76" y2="36" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<line x1="66" y1="36" x2="66" y2="45" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<line x1="74" y1="36" x2="74" y2="43" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<text x="88" y="36" font-size="18" font-weight="700" fill="#1f5560" text-anchor="start">AAN</text>
<text x="88" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Assessment Account Number</text>
<path d="M112,66 L112,93" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="8" y="98" width="208" height="112" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<rect x="90" y="106" width="44" height="8" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="136" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Assessment account</text>
<text x="20" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Assessed value, classification and</text>
<text x="20" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">other taxation information.</text>
<rect x="8" y="224" width="208" height="104" rx="3" fill="#ffffff" stroke="#cfcac0" stroke-width="1"/>
<text x="20" y="244" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Does not establish</text>
<text x="20" y="264" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The legal boundary, road access,</text>
<text x="20" y="279.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">ownership quality or an approved</text>
<text x="20" y="295.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">use.</text>
<circle cx="254" cy="36" r="11" fill="#ffffff" stroke="#1f5560" stroke-width="3"/>
<line x1="265" y1="36" x2="300" y2="36" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<line x1="290" y1="36" x2="290" y2="45" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<line x1="298" y1="36" x2="298" y2="43" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<text x="312" y="36" font-size="18" font-weight="700" fill="#1f5560" text-anchor="start">PID</text>
<text x="312" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Parcel Identification Number</text>
<path d="M336,66 L336,93" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="232" y="98" width="208" height="112" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<rect x="314" y="106" width="44" height="8" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="244" y="136" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Mapped land parcel</text>
<text x="244" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Routes toward parcel mapping</text>
<text x="244" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and registry information.</text>
<rect x="232" y="224" width="208" height="104" rx="3" fill="#ffffff" stroke="#cfcac0" stroke-width="1"/>
<text x="244" y="244" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Does not establish</text>
<text x="244" y="264" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A survey of every boundary on the</text>
<text x="244" y="279.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">ground, access, permitted use,</text>
<text x="244" y="295.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">physical condition, or freedom</text>
<text x="244" y="310.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">from competing interests.</text>
<path d="M478,54 C474,46 467,40 467,33 A11,11 0 1,1 489,33 C489,40 482,46 478,54 Z" fill="#ffffff" stroke="#1f5560" stroke-width="3" stroke-linejoin="round"/>
<circle cx="478" cy="33" r="3.5" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="500" y="36" font-size="18" font-weight="700" fill="#1f5560" text-anchor="start">Civic address</text>
<text x="500" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">or location field</text>
<path d="M560,66 L560,93" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="456" y="98" width="208" height="112" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="468" y="136" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">A place</text>
<text x="468" y="156" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Points toward a building or civic</text>
<text x="468" y="171.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">point. Helps find the area.</text>
<rect x="456" y="224" width="208" height="104" rx="3" fill="#ffffff" stroke="#cfcac0" stroke-width="1"/>
<text x="468" y="244" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Does not establish</text>
<text x="468" y="264" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The mapped land parcel. Related</text>
<text x="468" y="279.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">to the PID but not</text>
<text x="468" y="295.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">interchangeable.</text>
<line x1="8" y1="344" x2="664" y2="344" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="8" y="364" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Property Online, Nova Scotia’s subscription system, supports searches using PID, owner, AAN and civic address.</text>
<text x="8" y="388" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Where the analogy ends: land records do more than describe an object on a shelf, and legal interests cannot be reduced to a library</text>
<text x="8" y="402.3" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">entry. Its value is that choosing the wrong key opens the wrong catalogue.</text></svg>
