<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 308" width="672" height="308" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Payment readiness extends beyond the hammer</title><desc>Authorized, funds ready, immediate payment, then three business days; three branches when the expected path breaks.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="308" fill="#ffffff"/><rect x="8" y="10" width="146" height="86" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="20" y="33" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Authorized</text>
<text x="20" y="53" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Identity, authority and</text>
<text x="20" y="68.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">conflict check</text>
<path d="M154,53 L175,53" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="178" y="10" width="146" height="86" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="190" y="33" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Funds ready</text>
<text x="190" y="53" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Event-accepted forms</text>
<text x="190" y="68.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">in hand</text>
<path d="M324,53 L345,53" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="348" y="10" width="146" height="86" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="360" y="33" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Immediate</text>
<text x="360" y="53" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Price or recovery</text>
<text x="360" y="68.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">deposit; Inverness</text>
<text x="360" y="84.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">registration amount</text>
<path d="M494,53 L515,53" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="518" y="10" width="146" height="86" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="530" y="33" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">3 business days</text>
<text x="530" y="53" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Any remaining</text>
<text x="530" y="68.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">purchase balance</text>
<text x="8" y="130" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">When the expected path breaks</text>
<text x="664" y="130" font-size="11" font-weight="400" fill="#4a4843" text-anchor="end">Dashed: a branch, not the expected path</text>
<rect x="8" y="142" width="208" height="104" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="165" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">No sufficient bid</text>
<text x="20" y="182" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Before there is a purchaser</text>
<text x="20" y="204" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Municipality may buy for the</text>
<text x="20" y="219.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">recovery amount — or advertise</text>
<text x="20" y="235.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">again for auction or tender.</text>
<rect x="232" y="142" width="208" height="104" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="244" y="165" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">No immediate payment</text>
<text x="244" y="182" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Immediately after a high bid</text>
<text x="244" y="204" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Treasurer puts the land up for sale</text>
<text x="244" y="219.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">again immediately.</text>
<rect x="456" y="142" width="208" height="104" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="468" y="165" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Balance missed</text>
<text x="468" y="182" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Not paid within 3 business days</text>
<text x="468" y="204" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Re-advertise and resell; resale</text>
<text x="468" y="219.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">expenses come out of the deposit.</text>
<rect x="8" y="266" width="656" height="34" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="287.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">The hammer finds a leading bid. Prepared payment completes the sale step.</text></svg>
