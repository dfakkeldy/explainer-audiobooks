<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 420" width="672" height="420" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Reading a coastal hazard scenario</title><desc>The 2100 worst case and what its colour does and does not report.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="420" fill="#ffffff"/><text x="8" y="24" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Scenario selector</text>
<rect x="8" y="34" width="92" height="28" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="54" y="53" font-size="12" font-weight="700" fill="#1f5560" text-anchor="middle">Current</text>
<rect x="104" y="34" width="92" height="28" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="150" y="53" font-size="12" font-weight="700" fill="#1f5560" text-anchor="middle">2050</text>
<rect x="200" y="34" width="92" height="28" rx="3" fill="#1f5560" stroke="#1f5560" stroke-width="1.5"/>
<text x="246" y="53" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2100</text>
<text x="8" y="82" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">The years are sea-level scenarios, not extra probabilities.</text>
<text x="8" y="120" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">2100 worst-case coastal flooding scenario</text>
<rect x="30" y="132" width="270" height="40" rx="0" fill="#9db8bf" stroke="#1f5560" stroke-width="1.5"/>
<text x="42" y="157" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Projected sea-level rise</text>
<text x="18" y="178" font-size="18" font-weight="700" fill="#1f5560" text-anchor="middle">+</text>
<rect x="30" y="176" width="270" height="40" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="42" y="201" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A one-in-one-hundred-year storm surge</text>
<text x="18" y="222" font-size="18" font-weight="700" fill="#1f5560" text-anchor="middle">+</text>
<rect x="30" y="220" width="270" height="40" rx="0" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="42" y="245" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The highest high tide</text>
<text x="30" y="280" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Combined, these make one future combination</text>
<text x="30" y="295.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">visible across a large area: a planning view.</text>
<rect x="8" y="340" width="292" height="72" rx="0" fill="#f3f1ec" stroke="#cfcac0" stroke-width="0.75"/>
<text x="18" y="360" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Published river-study layers are different</text>
<text x="18" y="378" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">A one-percent or five-percent annual-exceedance</text>
<text x="18" y="392.3" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">probability describes the event mapped by that study</text>
<text x="18" y="406.6" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">(see Chapter 5).</text>
<rect x="336" y="8" width="328" height="184" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="350" y="32" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">What the colour means</text>
<path d="M353,50 L356.5,54 L363.5,46" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="374" y="54" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The selected scenario</text>
<path d="M353,72 L356.5,76 L363.5,68" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="374" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Current data</text>
<path d="M353,94 L356.5,98 L363.5,90" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="374" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The model</text>
<path d="M353,116 L356.5,120 L363.5,112" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="374" y="120" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The resolution</text>
<path d="M353,138 L356.5,142 L363.5,134" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="374" y="142" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The map guidance</text>
<text x="350" y="170" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Search by community, address or PID.</text>
<rect x="336" y="204" width="328" height="208" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="350" y="228" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">What it does not report</text>
<circle cx="646" cy="224" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="228" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="354" y="252" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="368" y="252" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The elevation of a surveyed building floor</text>
<text x="354" y="271.6" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="368" y="271.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The condition of a shoreline protection structure</text>
<text x="354" y="291.2" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="368" y="291.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The route floodwater would take through a culvert</text>
<text x="354" y="310.8" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="368" y="310.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The damage a particular storm will cause</text>
<line x1="350" y1="326.4" x2="650" y2="326.4" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="350" y="344.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Not an engineering design, an insurance decision or</text>
<text x="350" y="360" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">a municipal development approval.</text></svg>
