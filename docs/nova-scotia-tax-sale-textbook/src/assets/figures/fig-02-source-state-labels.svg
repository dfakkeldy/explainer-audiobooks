<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 380" width="672" height="380" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>A dated research file</title><desc>Harbour Road's file card and three dated source states.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="380" fill="#ffffff"/><rect x="116" y="10" width="230" height="22" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="126" y="26" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Harbour Road · research file</text>
<rect x="116" y="30" width="440" height="118" rx="0" fill="#ffffff" stroke="#cfcac0" stroke-width="1.5"/>
<line x1="116" y1="30" x2="556" y2="30" stroke="#1f5560" stroke-width="3" stroke-linecap="butt"/>
<text x="546" y="24" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="end">Composite — not a real property</text>
<text x="130" y="60" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Packet retrieved</text>
<line x1="336" y1="64" x2="542" y2="64" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="340" y="60" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">date</text>
<line x1="124" y1="76" x2="548" y2="76" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="130" y="96" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Last event-status check</text>
<line x1="336" y1="100" x2="542" y2="100" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="340" y="96" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">date</text>
<line x1="124" y1="112" x2="548" y2="112" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="130" y="132" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Beside every amount and marker</text>
<line x1="336" y1="136" x2="542" y2="136" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="340" y="132" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">a source page and date</text>
<text x="8" y="184" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Source-state labels</text>
<text x="664" y="184" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="end">Not to scale</text>
<line x1="20" y1="210" x2="560" y2="210" stroke="#1f5560" stroke-width="2.25" stroke-linecap="butt"/>
<line x1="560" y1="210" x2="652" y2="210" stroke="#1f5560" stroke-width="2.25" stroke-linecap="butt" stroke-dasharray="6 4"/>
<circle cx="112" cy="210" r="7" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<line x1="112" y1="217" x2="112" y2="230" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="12" y="230" width="200" height="57.2" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="24" y="250" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Packet retrieved July 20</text>
<text x="24" y="267.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Describes one snapshot.</text>
<circle cx="336" cy="210" r="7" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<line x1="336" y1="217" x2="336" y2="230" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="236" y="230" width="200" height="72.8" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="248" y="250" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Municipal page checked</text>
<text x="248" y="265.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">August 10</text>
<text x="248" y="283.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Describes a later state.</text>
<circle cx="560" cy="210" r="7" fill="#ffffff" stroke="#1f5560" stroke-width="2.25"/>
<line x1="560" y1="217" x2="560" y2="230" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="6 4"/>
<rect x="460" y="230" width="200" height="104" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="472" y="250" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Treasurer confirmed</text>
<text x="472" y="265.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">withdrawn August 11</text>
<text x="472" y="283.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Would describe an event-day</text>
<text x="472" y="298.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">fact, only if that confirmation</text>
<text x="472" y="314.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">actually occurred.</text>
<text x="336" y="366" font-size="12" font-weight="400" fill="#4a4843" text-anchor="middle">The dates preserve change instead of forcing one document to erase another.</text></svg>
