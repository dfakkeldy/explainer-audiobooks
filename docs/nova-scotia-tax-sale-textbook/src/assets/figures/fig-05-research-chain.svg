<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 236" width="672" height="236" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>The research chain</title><desc>Notice, parcel, context, unknowns, handoff, each with its one-line job.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="236" fill="#ffffff"/><rect x="8" y="8" width="113.6" height="32" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<rect x="8" y="36" width="113.6" height="4" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="18" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">1  Notice</text>
<rect x="8" y="40" width="113.6" height="146.8" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="18" y="59" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Choose the</text>
<text x="18" y="74.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record family,</text>
<text x="18" y="90.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">municipality,</text>
<text x="18" y="105.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">event, date and</text>
<text x="18" y="121.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">direct official</text>
<text x="18" y="137" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source.</text>
<path d="M124.6,24 L139.6,24" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="143.6" y="8" width="113.6" height="32" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<rect x="143.6" y="36" width="113.6" height="4" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="153.6" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">2  Parcel</text>
<rect x="143.6" y="40" width="113.6" height="146.8" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="153.6" y="59" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Establish the</text>
<text x="153.6" y="74.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">exact PID or</text>
<text x="153.6" y="90.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">authoritative</text>
<text x="153.6" y="105.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">civic-point</text>
<text x="153.6" y="121.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">containment and</text>
<text x="153.6" y="137" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">keep mapped</text>
<text x="153.6" y="152.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">geometry</text>
<text x="153.6" y="168.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">bounded.</text>
<path d="M260.2,24 L275.2,24" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="279.2" y="8" width="113.6" height="32" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<rect x="279.2" y="36" width="113.6" height="4" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="289.2" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">3  Context</text>
<rect x="279.2" y="40" width="113.6" height="146.8" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="289.2" y="59" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Ask one</text>
<text x="289.2" y="74.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source-sized</text>
<text x="289.2" y="90.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">question through</text>
<text x="289.2" y="105.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">one layer or</text>
<text x="289.2" y="121.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">service.</text>
<path d="M395.8,24 L410.8,24" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="414.8" y="8" width="113.6" height="32" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<rect x="414.8" y="36" width="113.6" height="4" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="424.8" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">4  Unknowns</text>
<rect x="414.8" y="40" width="113.6" height="146.8" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="424.8" y="59" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Write what the</text>
<text x="424.8" y="74.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">result cannot</text>
<text x="424.8" y="90.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">establish and</text>
<text x="424.8" y="105.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">distinguish empty</text>
<text x="424.8" y="121.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">from error.</text>
<path d="M531.4,24 L546.4,24" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="550.4" y="8" width="113.6" height="32" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<rect x="550.4" y="36" width="113.6" height="4" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="560.4" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">5  Handoff</text>
<rect x="550.4" y="40" width="113.6" height="146.8" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="560.4" y="59" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Name the next</text>
<text x="560.4" y="74.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record, authority</text>
<text x="560.4" y="90.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">or qualified</text>
<text x="560.4" y="105.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">professional.</text>
<line x1="8" y1="200.8" x2="664" y2="200.8" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="336" y="220.8" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="middle">The method does not end with a score.</text></svg>
