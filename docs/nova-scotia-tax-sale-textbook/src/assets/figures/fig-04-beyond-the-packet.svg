<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 200" width="672" height="200" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Credit the packet; add the missing work</title><desc>Three columns: municipal packet, research layer, handoff layer.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="200" fill="#ffffff"/><rect x="8" y="10" width="190" height="124" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="10" width="6" height="124" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="38" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Municipal packet</text>
<text x="26" y="62" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Lien, AAN, PID, recovery</text>
<text x="26" y="77.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">amount, assessment,</text>
<text x="26" y="93.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption marker, map and</text>
<text x="26" y="108.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">legal description.</text>
<path d="M204,72 L232,72" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="241" y="10" width="190" height="124" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="255" y="38" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Research layer</text>
<text x="255" y="62" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Reconciliation, planning,</text>
<text x="255" y="77.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">terrain, screening limits, dated</text>
<text x="255" y="93.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">observations and source log.</text>
<path d="M437,72 L465,72" fill="none" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="474" y="10" width="190" height="124" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="488" y="38" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Handoff layer</text>
<text x="488" y="62" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Questions for lawyer, surveyor,</text>
<text x="488" y="77.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">planner, insurer, inspector and</text>
<text x="488" y="93.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">environmental professional.</text>
<circle cx="646" cy="34" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="38" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<line x1="8" y1="158" x2="664" y2="158" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="8" y="184" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">The value-add begins after the municipality’s facts, map and legal description.</text></svg>
