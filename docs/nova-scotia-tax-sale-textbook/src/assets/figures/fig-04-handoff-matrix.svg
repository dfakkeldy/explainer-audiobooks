<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 384.8" width="672" height="384.8" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Who answers which question</title><desc>Three handoffs from one file: lawyer, surveyor, planner.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="384.8" fill="#ffffff"/><rect x="8" y="8" width="656" height="46" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="18" y="27" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Professional</text>
<text x="110" y="27" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">What the file sends</text>
<text x="306" y="27" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">The question asked</text>
<text x="502" y="27" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">What this professional</text>
<text x="502" y="42.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">does not decide</text>
<line x1="8" y1="54" x2="664" y2="54" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="18" y="76" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Lawyer</text>
<text x="110" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Exact PID; dated municipal</text>
<text x="110" y="91.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record; relevant instrument</text>
<text x="110" y="107.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">references; legal description;</text>
<text x="110" y="122.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">captured public view with</text>
<text x="110" y="138.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">attribution; intended use.</text>
<text x="306" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Which registered rights provide</text>
<text x="306" y="91.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">legal access, and what interests</text>
<text x="306" y="107.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">or documents must be reviewed?</text>
<rect x="496" y="60" width="164" height="92" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="502" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Where a monument lies on</text>
<text x="502" y="91.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the ground.</text>
<line x1="8" y1="158" x2="664" y2="158" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="18" y="180" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Surveyor</text>
<text x="110" y="180" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The mapped-boundary and</text>
<text x="110" y="195.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">description question, from the</text>
<text x="110" y="211.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">same file.</text>
<text x="306" y="180" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What evidence is needed to</text>
<text x="306" y="195.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">locate the relevant boundary or</text>
<text x="306" y="211.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">plan relationship, and can that</text>
<text x="306" y="226.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">work be completed before the</text>
<text x="306" y="242.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">decision deadline?</text>
<rect x="496" y="164" width="164" height="92" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="502" y="180" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What a tax deed does to a</text>
<text x="502" y="195.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">registered interest.</text>
<line x1="8" y1="262" x2="664" y2="262" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="18" y="284" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Planner</text>
<text x="110" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Proposed use; current municipal</text>
<text x="110" y="299.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source; parcel identifiers.</text>
<text x="306" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Which planning, lot, frontage,</text>
<text x="306" y="299.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">servicing or permit questions</text>
<text x="306" y="315.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">require confirmation?</text>
<rect x="496" y="268" width="164" height="60.8" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="502" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Title or physical condition.</text>
<line x1="8" y1="334.8" x2="664" y2="334.8" stroke="#1f5560" stroke-width="1.5" stroke-linecap="butt"/>
<text x="8" y="358.8" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">The roles overlap around the parcel without becoming substitutes.</text>
<text x="664" y="374.8" font-size="11" font-weight="400" fill="#4a4843" text-anchor="end">Birch Point Road: composite — not a real property</text></svg>
