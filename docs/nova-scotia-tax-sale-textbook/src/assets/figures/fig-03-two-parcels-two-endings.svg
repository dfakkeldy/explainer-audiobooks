<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 494" width="672" height="494" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Two parcels, two endings</title><desc>Two fictional parcels sold at the same auction end in a discharge and a registered deed.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker><marker id="arrow-7a3e6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a3e6e"/></marker></defs><rect width="672" height="494" fill="#ffffff"/><text x="664" y="20" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="end">Composite cases — not real properties</text>
<rect x="8" y="48" width="82" height="370" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="49" y="213" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">One</text>
<text x="49" y="229" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">auction</text>
<text x="49" y="253" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">Both</text>
<text x="49" y="268.6" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">purchasers</text>
<text x="49" y="284.2" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">pay in full</text>
<text x="108" y="36" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Harbour Road · marked redeemable</text>
<text x="108" y="210" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Quarry Lane · older-arrears category</text>
<rect x="108" y="48" width="124" height="128" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="120" y="72" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Paid in full</text>
<text x="120" y="92.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Full payment</text>
<text x="120" y="108.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">produces a</text>
<text x="120" y="124.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">certificate of sale.</text>
<rect x="250" y="48" width="124" height="128" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="262" y="72" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Certificate</text>
<text x="262" y="88.9" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">holder</text>
<text x="262" y="109.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Six-month</text>
<text x="262" y="125.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption right</text>
<text x="262" y="141" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">still live.</text>
<rect x="392" y="48" width="124" height="128" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="404" y="72" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Month 4:</text>
<text x="404" y="88.9" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">redeemed</text>
<text x="404" y="109.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Purchaser supplies</text>
<text x="404" y="125.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">records for the</text>
<text x="404" y="141" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">statutory</text>
<text x="404" y="156.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">accounting.</text>
<rect x="534" y="48" width="124" height="128" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="1.5"/>
<path d="M547,67 L550.5,71 L557.5,63" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="566" y="72" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">Discharged</text>
<text x="546" y="92.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Repaid through the</text>
<text x="546" y="108.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">process; rights in</text>
<text x="546" y="124.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the land end.</text>
<path d="M232,112 L247,112" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M374,112 L389,112" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M516,112 L531,112" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M90,112 L105,112" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="108" y="222" width="124" height="116" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="120" y="246" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Paid in full</text>
<text x="120" y="266.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">No normal</text>
<text x="120" y="282.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">six-month</text>
<text x="120" y="298.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption right.</text>
<rect x="250" y="222" width="124" height="116" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="262" y="246" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Deed requested</text>
<text x="262" y="266.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The purchaser</text>
<text x="262" y="282.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">requests the deed</text>
<text x="262" y="298.1" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and registers it.</text>
<rect x="392" y="222" width="124" height="116" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="1.5"/>
<path d="M405,241 L408.5,245 L415.5,237" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="424" y="246" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">Deed</text>
<text x="424" y="262.9" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">registered</text>
<text x="404" y="283.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The ownership</text>
<text x="404" y="299.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">document for that</text>
<text x="404" y="315" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">stage.</text>
<path d="M232,280 L247,280" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M374,280 L389,280" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M90,280 L105,280" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<text x="534" y="230" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">It does not answer:</text>
<rect x="534" y="240" width="124" height="84" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="550" cy="258" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="550" y="262" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="546" y="280" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Is the apparent</text>
<text x="546" y="295.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">driveway a legal</text>
<text x="546" y="311.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">right-of-way?</text>
<rect x="534" y="334" width="124" height="84" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="550" cy="352" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="550" y="356" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="546" y="374" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Does someone</text>
<text x="546" y="389.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">occupy a building?</text>
<path d="M516,280 L531.02,281.67" fill="none" stroke="#7a3e6e" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-7a3e6e)"/>
<rect x="8" y="434" width="656" height="52" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="20" y="456" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Harbour Road leaves through discharge: the first purchaser’s rights have ended.</text>
<text x="20" y="474" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Quarry Lane leaves through a registered deed: the second purchaser’s ownership work has begun.</text></svg>
