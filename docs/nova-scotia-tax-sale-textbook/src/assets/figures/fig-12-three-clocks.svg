<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 432" width="672" height="432" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Three clocks, two starting points</title><desc>The redemption period and the 20-year surplus limit are counted from the sale date; the six-year Marketable Titles Act period runs from deed registration.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="432" fill="#ffffff"/><text x="8" y="20" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Clocks that start on the sale date</text>
<line x1="40" y1="30" x2="40" y2="182" stroke="#1d1c1a" stroke-width="2.25" stroke-linecap="butt"/>
<text x="46" y="42" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Sale date</text>
<rect x="40" y="52" width="130" height="28" rx="0" fill="#1f5560" stroke="#1f5560" stroke-width="1.5"/>
<text x="105" y="70.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Six months</text>
<text x="182" y="64" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Redemption period (redeemable property)</text>
<text x="182" y="79" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">If unredeemed, the purchaser may request the deed after six months.</text>
<rect x="40" y="92" width="130" height="28" rx="0" fill="#ffffff" stroke="#4a4843" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="105" y="110.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">No six-month period</text>
<text x="182" y="104" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Older-arrears route (taxes unpaid for more than six years at sale)</text>
<text x="182" y="119" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The purchaser may request the deed after the sale.</text>
<rect x="170" y="140" width="456" height="28" rx="0" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<path d="M628,135 L635,173" fill="none" stroke="#4a4843" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M636,135 L643,173" fill="none" stroke="#4a4843" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="652" y1="134" x2="652" y2="174" stroke="#1d1c1a" stroke-width="2.25" stroke-linecap="butt"/>
<text x="182" y="158.5" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Surplus window: application to the Supreme Court</text>
<text x="170" y="186" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A person claiming an interest may apply after the</text>
<text x="170" y="201.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption period.</text>
<text x="652" y="186" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="end">Closes: 20 years from the sale</text>
<line x1="8" y1="214" x2="664" y2="214" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="8" y="238" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">The clock that starts on deed registration</text>
<line x1="212" y1="250" x2="212" y2="316" stroke="#1d1c1a" stroke-width="2.25" stroke-linecap="butt"/>
<text x="218" y="262" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Deed-registration date</text>
<rect x="212" y="272" width="240" height="28" rx="0" fill="#1f5560" stroke="#1f5560" stroke-width="1.5"/>
<text x="332" y="290.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Six years (Marketable Titles Act)</text>
<line x1="452" y1="266" x2="452" y2="306" stroke="#1d1c1a" stroke-width="2.25" stroke-linecap="butt"/>
<text x="218" y="318" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A tax deed generally may be set aside only in this period.</text>
<text x="464" y="276" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">After it: strong binding and</text>
<text x="464" y="291.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">conclusive effect, subject to:</text>
<rect x="212" y="336" width="452" height="68" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<circle cx="226" cy="354" r="2.5" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="236" y="358" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the land-exclusion rule, where its statutory conditions are met</text>
<circle cx="226" cy="371" r="2.5" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="236" y="375" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the current owner's fraud or breach of trust</text>
<circle cx="226" cy="388" r="2.5" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="236" y="392" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">a preserved damages claim for wrongful tax sale</text>
<path d="M612,310 L612,333" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="8" y="254" width="186" height="100" rx="3" fill="#f3f1ec" stroke="#6b6a66" stroke-width="1"/>
<text x="20" y="278" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Not auction day, not the end</text>
<text x="20" y="293.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">of redemption, not deed</text>
<text x="20" y="309.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">delivery, not first entry: the</text>
<text x="20" y="324.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">six years start at</text>
<text x="20" y="340.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">registration.</text>
<text x="8" y="418" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Not to scale</text></svg>
