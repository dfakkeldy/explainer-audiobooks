<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 352" width="672" height="352" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Anatomy of a research note</title><desc>The River Denys note in six labelled parts, with what is lost if a part is dropped.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="352" fill="#ffffff"/><rect x="20" y="8" width="150" height="30" rx="3" fill="#e6eef0" stroke="#cfcac0" stroke-width="0.75"/>
<text x="32" y="28" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">River Denys · File note</text>
<rect x="8" y="38" width="430" height="306.8" rx="0" fill="#e6eef0" stroke="#cfcac0" stroke-width="0.75"/>
<line x1="8" y1="38" x2="438" y2="38" stroke="#1f5560" stroke-width="2.25" stroke-linecap="butt"/>
<text x="22" y="66" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Source</text>
<text x="126" y="66" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">current provincial road and water services in the</text>
<text x="126" y="81.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">checked production build.</text>
<line x1="20" y1="95.2" x2="426" y2="95.2" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="111.2" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Date</text>
<text x="126" y="111.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">July 20, 2026 capture.</text>
<line x1="20" y1="124.8" x2="426" y2="124.8" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="140.8" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Observation</text>
<text x="126" y="140.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the service returned River Denys water intersections and</text>
<text x="126" y="156.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">no mapped road or trail intersection for the selected</text>
<text x="126" y="172" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">polygon; transportation remained visible nearby.</text>
<line x1="20" y1="185.6" x2="426" y2="185.6" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="201.6" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Limitation</text>
<text x="126" y="201.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">both source geometry and parcel geometry are</text>
<text x="126" y="217.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">screening data.</text>
<line x1="20" y1="230.8" x2="426" y2="230.8" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="246.8" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Unknown</text>
<text x="126" y="246.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">legal access, ground conditions, water constraints, and</text>
<text x="126" y="262.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">current service completeness.</text>
<line x1="20" y1="276" x2="426" y2="276" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="292" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Next authority</text>
<text x="126" y="292" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">land records and a lawyer for access; survey and current</text>
<text x="126" y="307.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">municipal or environmental sources for the physical and</text>
<text x="126" y="323.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">regulatory questions.</text>
<path d="M448,192.60000000000002 L456,192.60000000000002 L456,223.8 L448,223.8" fill="none" stroke="#a33b28" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="456" y1="208.2" x2="466" y2="208.2" stroke="#a33b28" stroke-width="1.5" stroke-linecap="butt"/>
<text x="476" y="191.6" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Lose the limitation</text>
<text x="476" y="209.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The result becomes too strong.</text>
<path d="M448,131.8 L456,131.8 L456,178.60000000000002 L448,178.60000000000002" fill="none" stroke="#a33b28" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="456" y1="155.2" x2="466" y2="155.2" stroke="#a33b28" stroke-width="1.5" stroke-linecap="butt"/>
<text x="476" y="130.8" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Lose the observation</text>
<text x="476" y="148.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The note becomes a generic</text>
<text x="476" y="164" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">disclaimer.</text>
<path d="M448,237.8 L456,237.8 L456,329.8 L448,329.8" fill="none" stroke="#a33b28" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="456" y1="283.8" x2="466" y2="283.8" stroke="#a33b28" stroke-width="1.5" stroke-linecap="butt"/>
<text x="476" y="259.4" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Lose the unknown and handoff</text>
<text x="476" y="277" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The note creates caution without</text>
<text x="476" y="292.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">progress.</text></svg>
