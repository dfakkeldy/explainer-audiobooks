<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 262" width="672" height="262" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Two formats, one written limit</title><desc>Open auction and sealed tender lanes both end at the same evidence file.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="262" fill="#ffffff"/><text x="8" y="20" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Open auction</text>
<rect x="8" y="30" width="122" height="58" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="69" y="63" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Register</text>
<path d="M130,59 L149,59" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="152" y="30" width="122" height="58" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="213" y="63" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Hear live calls</text>
<path d="M274,59 L293,59" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="296" y="30" width="122" height="58" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="357" y="55.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">Card rises only</text>
<text x="357" y="70.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">below the limit</text>
<text x="8" y="122" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Sealed tender</text>
<rect x="8" y="132" width="122" height="58" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="69" y="165" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Choose once</text>
<path d="M130,161 L149,161" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="152" y="132" width="122" height="58" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="213" y="165" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Submit by deadline</text>
<path d="M274,161 L293,161" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="296" y="132" width="122" height="58" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="357" y="157.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">No live</text>
<text x="357" y="172.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">adjustment</text>
<rect x="462" y="30" width="202" height="160" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="2.25"/>
<text x="478" y="60" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Same evidence file</text>
<text x="478" y="86" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Eligibility, authority, event terms</text>
<text x="478" y="101.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and walk-away rule do not</text>
<text x="478" y="117.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">change.</text>
<line x1="478" y1="138" x2="648" y2="138" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="478" y="160" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Same written walk-away rule</text>
<path d="M418,59 L459,59" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M418,161 L459,161" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="8" y="218" width="656" height="34" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="239.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">Open bidding reveals competitors; a tender hides them, but both reward a prewritten limit.</text></svg>
