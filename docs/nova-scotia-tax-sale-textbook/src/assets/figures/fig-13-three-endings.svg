<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 420" width="672" height="420" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Three files, three endings</title><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="420" fill="#ffffff"/><rect x="128" y="8" width="173.33" height="34" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="214.67" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Alder Crossing</text>
<rect x="309.33" y="8" width="173.33" height="34" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="396" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Union Workshop</text>
<rect x="490.67" y="8" width="173.33" height="34" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="577.33" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Meadow Line</text>
<text x="8" y="23" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Fictional files</text>
<text x="8" y="37" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">(composite cases)</text>
<text x="8" y="68" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Verified fact</text>
<rect x="128" y="50" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="138" y="72" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">One account with two PIDs;</text>
<text x="138" y="87.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the civic point lies inside one</text>
<text x="138" y="103.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">parcel polygon.</text>
<rect x="309.33" y="50" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="319.33" y="72" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Dated notice, exact PID and</text>
<text x="319.33" y="87.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">specific public-source</text>
<text x="319.33" y="103.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">returns.</text>
<rect x="490.67" y="50" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="500.67" y="72" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Summary and detail agree;</text>
<text x="500.67" y="87.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">AAN and PID consistent;</text>
<text x="500.67" y="103.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">mapped road; zoning</text>
<text x="500.67" y="118.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">response.</text>
<text x="8" y="158.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Unresolved</text>
<text x="8" y="174" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">question</text>
<rect x="128" y="140.4" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="289.33" cy="152.4" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="289.33" y="156.4" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="138" y="162.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Which interest is sold, and</text>
<text x="138" y="178" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">how the PIDs, account,</text>
<text x="138" y="193.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">descriptions and building</text>
<text x="138" y="209.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">relate.</text>
<rect x="309.33" y="140.4" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="470.67" cy="152.4" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="470.67" y="156.4" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="319.33" y="162.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Possession, former use,</text>
<text x="319.33" y="178" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">condition, insurance and</text>
<text x="319.33" y="193.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">tax treatment.</text>
<rect x="490.67" y="140.4" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="652" cy="152.4" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="652" y="156.4" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="500.67" y="162.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Access, frontage, lot, use</text>
<text x="500.67" y="178" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and services.</text>
<text x="8" y="248.8" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Next authority</text>
<rect x="128" y="230.8" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="138" y="252.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The municipality's current</text>
<text x="138" y="268.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">notice or confirmation;</text>
<text x="138" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">counsel's land-record review.</text>
<rect x="309.33" y="230.8" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="319.33" y="252.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Counsel; environmental and</text>
<text x="319.33" y="268.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">building professionals;</text>
<text x="319.33" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">municipality; insurer; tax</text>
<text x="319.33" y="299.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">adviser.</text>
<rect x="490.67" y="230.8" width="173.33" height="82.4" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="500.67" y="252.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Lawyer; municipality; site</text>
<text x="500.67" y="268.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">professionals; surveyor if</text>
<text x="500.67" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">needed.</text>
<text x="8" y="339.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Consequence</text>
<rect x="128" y="321.2" width="173.33" height="90.8" rx="3" fill="#f6e8e3" stroke="#a33b28" stroke-width="3"/>
<rect x="139" y="339.2" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="160" y="346.2" font-size="13" font-weight="700" fill="#a33b28" text-anchor="start">Stop</text>
<text x="138" y="367.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Unresolved parcel-identity</text>
<text x="138" y="382.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">conflict.</text>
<rect x="309.33" y="321.2" width="173.33" height="90.8" rx="3" fill="#f6e8e3" stroke="#a33b28" stroke-width="3"/>
<rect x="320.33" y="339.2" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="341.33" y="346.2" font-size="13" font-weight="700" fill="#a33b28" text-anchor="start">Stop</text>
<text x="319.33" y="367.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Not priceable in time; the</text>
<text x="319.33" y="382.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">bidder owns the decision to</text>
<text x="319.33" y="398.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">stop.</text>
<rect x="490.67" y="321.2" width="173.33" height="90.8" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="2.25"/>
<path d="M502.6666666666667,341.20000000000005 L506.1666666666667,345.20000000000005 L513.1666666666667,337.20000000000005" fill="none" stroke="#2f5e46" stroke-width="2.25" stroke-linejoin="round"/>
<text x="522.67" y="346.2" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">Decision point</text>
<text x="500.67" y="367.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">It belongs to the bidder; not</text>
<text x="500.67" y="382.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">a recommendation.</text></svg>
