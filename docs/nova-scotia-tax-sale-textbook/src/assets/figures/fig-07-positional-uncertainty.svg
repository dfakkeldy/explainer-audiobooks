<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 400" width="672" height="400" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>A point with a position quality</title><desc>A mine-opening symbol just outside a fictional parcel, with a circle of about 50 m.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="400" fill="#ffffff"/><rect x="8" y="8" width="420" height="384" rx="0" fill="#f3f1ec" stroke="#cfcac0" stroke-width="0.75"/>
<path d="M8,300 L428,248" fill="none" stroke="#6b6a66" stroke-width="12" stroke-linejoin="round"/>
<path d="M8,300 L428,248" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
<text x="24" y="286" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">road</text>
<path d="M80,60 L270,52 L282,226 L94,244 Z" fill="#ffffff" stroke="#1f5560" stroke-width="2.25" stroke-linejoin="round"/>
<text x="96" y="82" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Fictional parcel</text>
<text x="96" y="98" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">(graphical line)</text>
<rect x="150" y="150" width="50" height="34" rx="0" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="175" y="202" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">building site</text>
<circle cx="316" cy="204" r="80" fill="#7a3e6e" fill-opacity="0.08" stroke="none" stroke-width="1.5"/>
<circle cx="316" cy="204" r="80" fill="none" stroke="#7a3e6e" stroke-width="1.75" stroke-dasharray="6 4"/>
<path d="M316,196 L324,204 L316,212 L308,204 Z" fill="#1d1c1a" stroke="#1d1c1a" stroke-width="1" stroke-linejoin="round"/>
<line x1="326" y1="204" x2="396" y2="204" stroke="#7a3e6e" stroke-width="1.25" stroke-linecap="butt"/>
<rect x="324.38" y="186.65" width="75.23" height="12.65" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="362" y="196" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">roughly 50 m</text>
<rect x="325" y="217.8" width="91.38" height="13.8" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="328" y="228" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">inventory point</text>
<rect x="24" y="360" width="80" height="6" rx="0" fill="#1d1c1a" stroke="none" stroke-width="1.5"/>
<line x1="24" y1="356" x2="24" y2="370" stroke="#1d1c1a" stroke-width="1.25" stroke-linecap="butt"/>
<line x1="104" y1="356" x2="104" y2="370" stroke="#1d1c1a" stroke-width="1.25" stroke-linecap="butt"/>
<text x="112" y="368" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">50 m (fictional plate)</text>
<text x="24" y="30" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="start">Composite — not a real property; not a survey.</text>
<rect x="444" y="8" width="220" height="176" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="456" y="32" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Position quality</text>
<circle cx="648" cy="28" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="648" y="32" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="456" y="54" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">2024 inventory: positions on private</text>
<text x="456" y="69.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">land can have lower confidence and</text>
<text x="456" y="85.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">may be inaccurate by roughly 50</text>
<text x="456" y="100.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">metres. That distance can cross a</text>
<text x="456" y="116.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">road, parcel line, building site or</text>
<text x="456" y="132" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">shoreline on a rural map.</text>
<rect x="444" y="196" width="220" height="196" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5"/>
<text x="456" y="220" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Coverage limits</text>
<text x="456" y="244" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">–</text>
<text x="468" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The inventory is incomplete.</text>
<text x="456" y="265.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">–</text>
<text x="468" y="265.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Undocumented openings exist.</text>
<text x="456" y="287.2" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">–</text>
<text x="468" y="287.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">It excludes surface expressions of</text>
<text x="468" y="302.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">subsidence.</text>
<text x="456" y="324.4" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">–</text>
<text x="468" y="324.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Site conditions may change.</text></svg>
