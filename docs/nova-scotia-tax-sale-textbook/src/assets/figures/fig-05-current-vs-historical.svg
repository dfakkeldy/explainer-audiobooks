<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 342" width="672" height="342" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Current notice or historical record</title><desc>Two kinds of evidence: current notices and historical records.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="342" fill="#ffffff"/><rect x="8" y="8" width="318" height="270.4" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="8" width="318" height="36" rx="3" fill="#24395a" stroke="none" stroke-width="1.5"/>
<rect x="8" y="30" width="318" height="14" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="24" y="32" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">Current notice</text>
<rect x="24" y="61" width="5" height="5" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="36" y="70" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What a municipality presently says it intends to sell.</text>
<rect x="24" y="86.6" width="5" height="5" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="36" y="95.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The municipality's current notice or direct</text>
<text x="36" y="111.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">confirmation controls whether the sale is live or a</text>
<text x="36" y="126.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">parcel remains listed.</text>
<rect x="24" y="143.4" width="5" height="5" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="36" y="152.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A copied PDF, screenshot, browser tab or map</text>
<text x="36" y="168" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">catalogue can become stale.</text>
<line x1="24" y1="189.6" x2="310" y2="189.6" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="24" y="207.6" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Example</text>
<text x="24" y="224.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Inverness, August 11, 2026 event. Snapshot checked</text>
<text x="24" y="240.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">July 22, 2026: 40 advertised, 5 withdrawn, 40 active</text>
<text x="24" y="255.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">PIDs.</text>
<rect x="346" y="8" width="318" height="270.4" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5"/>
<rect x="346" y="8" width="318" height="36" rx="3" fill="#f3f1ec" stroke="#6b6a66" stroke-width="1.5"/>
<text x="362" y="32" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Historical record</text>
<rect x="362" y="61" width="5" height="5" rx="0" fill="#6b6a66" stroke="none" stroke-width="1.5"/>
<text x="374" y="70" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Dated results from completed events. Off by</text>
<text x="374" y="85.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">default.</text>
<rect x="362" y="102.2" width="5" height="5" rx="0" fill="#6b6a66" stroke="none" stroke-width="1.5"/>
<text x="374" y="111.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Can hold a recent event whose outcome remains</text>
<text x="374" y="126.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">unknown while official results are pending.</text>
<rect x="362" y="143.4" width="5" height="5" rx="0" fill="#6b6a66" stroke="none" stroke-width="1.5"/>
<text x="374" y="152.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">An opening or winning amount from an older event</text>
<text x="374" y="168" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">does not become a present valuation.</text>
<line x1="362" y1="189.6" x2="648" y2="189.6" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="362" y="207.6" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Examples</text>
<text x="362" y="224.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Halifax PID 00542589, March 8, 2022 event.</text>
<text x="362" y="244.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">CBRM PID 15234636, July 21, 2026 event: “Awaiting</text>
<text x="362" y="259.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">official results.”</text>
<rect x="8" y="294.4" width="656" height="40" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="336" y="319.4" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Name the record family before repeating any amount.</text></svg>
