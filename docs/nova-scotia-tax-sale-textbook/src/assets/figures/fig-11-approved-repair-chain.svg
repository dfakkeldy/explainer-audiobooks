<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 384" width="672" height="384" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>The chain behind a reimbursable repair</title><desc>Five links from observed risk to a documented, paid, approved repair.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="384" fill="#ffffff"/><text x="8" y="22" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Composite case: the fictional Cedar Street file</text>
<text x="664" y="22" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="end">Not a real property</text>
<rect x="8" y="40" width="118" height="150" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="18" y="62" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">1 Observed risk</text>
<text x="18" y="82" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A qualified</text>
<text x="18" y="97.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">exterior</text>
<text x="18" y="113.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">assessment finds</text>
<text x="18" y="128.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">a loose roof</text>
<text x="18" y="144.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">covering.</text>
<path d="M126,115 L139.5,115" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="142.5" y="40" width="118" height="150" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="152.5" y="62" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">2 Defined</text>
<text x="152.5" y="78" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">scope</text>
<text x="152.5" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Maya sends the</text>
<text x="152.5" y="113.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">treasurer a</text>
<text x="152.5" y="129.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">defined scope,</text>
<text x="152.5" y="144.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">supporting</text>
<text x="152.5" y="160.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">assessment and</text>
<text x="152.5" y="176" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">cost.</text>
<path d="M260.5,115 L274,115" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="277" y="40" width="118" height="150" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<rect x="277" y="40" width="6" height="150" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="291" y="62" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">3 Written</text>
<text x="291" y="78" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">approval</text>
<text x="291" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The treasurer</text>
<text x="291" y="113.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">approves that</text>
<text x="291" y="129.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">scope in writing.</text>
<path d="M395,115 L408.5,115" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="411.5" y="40" width="118" height="150" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="421.5" y="62" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">4 Lawful work</text>
<text x="421.5" y="82" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The contractor</text>
<text x="421.5" y="97.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">does only that</text>
<text x="421.5" y="113.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">scope, through</text>
<text x="421.5" y="128.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">lawful and safe</text>
<text x="421.5" y="144.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">access.</text>
<path d="M529.5,115 L543,115" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="546" y="40" width="118" height="150" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="556" y="62" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">5 Paid and</text>
<text x="556" y="78" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">recorded</text>
<text x="556" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Invoice, proof of</text>
<text x="556" y="113.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">payment and</text>
<text x="556" y="129.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">dated completion</text>
<text x="556" y="144.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">record, kept</text>
<text x="556" y="160.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">together.</text>
<text x="8" y="224" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Remove any one link</text>
<rect x="8" y="236" width="72" height="34" rx="3" fill="#e6eef0" stroke="#1f6b6e" stroke-width="1"/>
<text x="44" y="257" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">1</text>
<rect x="90" y="236" width="72" height="34" rx="3" fill="#e6eef0" stroke="#1f6b6e" stroke-width="1"/>
<text x="126" y="257" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">2</text>
<rect x="172" y="236" width="72" height="34" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="208" cy="253" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="208" y="257" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<rect x="254" y="236" width="72" height="34" rx="3" fill="#e6eef0" stroke="#1f6b6e" stroke-width="1"/>
<text x="290" y="257" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">4</text>
<rect x="336" y="236" width="72" height="34" rx="3" fill="#e6eef0" stroke="#1f6b6e" stroke-width="1"/>
<text x="372" y="257" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">5</text>
<text x="8" y="294" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The reimbursement claim becomes a different question. Good intentions</text>
<text x="8" y="309.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">cannot reconstruct missing authority after redemption begins.</text>
<rect x="440" y="210" width="224" height="116" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="458" cy="230" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="458" y="234" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="472" y="234" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">A larger defect</text>
<text x="452" y="256" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Work does not silently expand. The</text>
<text x="452" y="271.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">new condition returns through the</text>
<text x="452" y="287.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">same authority, professional and</text>
<text x="452" y="302.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">insurance channels.</text>
<rect x="8" y="336" width="656" height="40" rx="0" fill="#e6eef0" stroke="none" stroke-width="1.5"/>
<text x="336" y="360.5" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="middle">The approved repair receipt becomes the concrete centre of the file.</text></svg>
