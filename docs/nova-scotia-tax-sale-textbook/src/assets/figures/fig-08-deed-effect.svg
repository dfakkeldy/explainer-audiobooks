<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 494" width="672" height="494" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>What the deed changes for Foundry Street</title><desc>Register entries before the deed and the three outcome lanes after it.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1d1c1a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1d1c1a"/></marker><marker id="arrow-1f6b6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6b6e"/></marker><marker id="arrow-7a3e6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a3e6e"/></marker></defs><rect width="672" height="494" fill="#ffffff"/><text x="8" y="20" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Fictional Foundry Street · Composite — not a real property; not a survey.</text>
<rect x="8" y="40" width="176" height="304" rx="3" fill="#f3f1ec" stroke="#6b6a66" stroke-width="1.5"/>
<text x="20" y="64" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Older parcel register</text>
<text x="20" y="80" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">before the deed</text>
<rect x="18" y="96" width="156" height="44" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="18" y="96" width="6" height="44" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="32" y="122" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Mortgage</text>
<rect x="18" y="166" width="156" height="44" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="18" y="166" width="6" height="44" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="32" y="192" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Judgment</text>
<rect x="18" y="236" width="156" height="56" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="18" y="236" width="6" height="56" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="32" y="258" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Registered right-of-way</text>
<text x="32" y="278" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">serving the house behind</text>
<rect x="214" y="40" width="112" height="304" rx="3" fill="#1f5560" stroke="#1f5560" stroke-width="1.5"/>
<text x="270" y="68" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Tax deed</text>
<text x="270" y="86" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">registered</text>
<text x="270" y="120" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Vests the land</text>
<text x="270" y="136" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">in fee simple,</text>
<text x="270" y="152" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">free and</text>
<text x="270" y="168" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">discharged from</text>
<text x="270" y="184" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">all encumbrances</text>
<text x="226" y="282" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start">Read with the</text>
<text x="226" y="296.3" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start">statute, any court</text>
<text x="226" y="310.6" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start">order, the deed</text>
<text x="226" y="324.9" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start">and the property</text>
<text x="226" y="339.2" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start">record.</text>
<rect x="356" y="40" width="308" height="98" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="368" y="62" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Interests the statute discharges</text>
<circle cx="648" cy="58" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="648" y="62" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="368" y="82" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Counsel confirms which. Mortgage and judgment sit</text>
<text x="368" y="97.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">here, not drawn as erased.</text>
<rect x="356" y="150" width="308" height="98" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="368" y="172" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Easements and rights-of-way</text>
<text x="368" y="192" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A benefit passes with the land; a burden continues as</text>
<text x="368" y="207.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the Act specifies.</text>
<rect x="356" y="260" width="308" height="84" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="368" y="282" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">If a court order exists</text>
<circle cx="648" cy="278" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="648" y="282" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="368" y="302" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Its exceptions, exclusions or partial interests apply.</text>
<path d="M174,118 L211,118" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1d1c1a)"/>
<path d="M174,188 L211.21,173.11" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1d1c1a)"/>
<path d="M326,130 L353.88,102.12" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1d1c1a)"/>
<line x1="174" y1="250" x2="214" y2="250" stroke="#1f6b6e" stroke-width="2.25" stroke-linecap="butt"/>
<line x1="214" y1="250" x2="326" y2="250" stroke="#ffffff" stroke-width="2.25" stroke-linecap="butt" stroke-dasharray="2 3"/>
<text x="270" y="240" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">may continue</text>
<path d="M326,250 L353.81,224.05" fill="none" stroke="#1f6b6e" stroke-width="2.25" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<path d="M326,300 L353,300" fill="none" stroke="#7a3e6e" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-7a3e6e)"/>
<line x1="8" y1="360" x2="664" y2="360" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="8" y="378" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Outside the title file</text>
<rect x="8" y="388" width="656" height="72" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="412" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Possible claim to surplus proceeds</text>
<text x="22" y="432" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A former interest holder's separate statutory route to money: not automatically a continuing burden on the land</text>
<text x="22" y="447.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">(Chapter 12).</text>
<text x="8" y="484" font-size="12" font-weight="700" fill="#1f5560" text-anchor="start">Each result comes from its governing source.</text></svg>
