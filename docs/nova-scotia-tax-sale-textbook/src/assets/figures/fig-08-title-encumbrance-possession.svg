<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 176" width="672" height="176" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Three questions, not three synonyms</title><desc>Title, rights and burdens, and possession as three separate columns.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="176" fill="#ffffff"/><rect x="8" y="8" width="192" height="160" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="8" y="8" width="192" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="22" y="42" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Title</text>
<text x="22" y="60" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Ownership interest</text>
<line x1="22" y1="72" x2="186" y2="72" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="94" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What ownership interest is</text>
<text x="22" y="109.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">recorded?</text>
<line x1="208" y1="83" x2="240" y2="83" stroke="#6b6a66" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="0.5 5"/>
<line x1="208" y1="93" x2="240" y2="93" stroke="#6b6a66" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="0.5 5"/>
<rect x="248" y="8" width="192" height="160" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="248" y="8" width="192" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="262" y="42" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Rights and burdens</text>
<line x1="262" y1="54" x2="426" y2="54" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="262" y="76" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What easements, liens or</text>
<text x="262" y="91.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">continuing interests may</text>
<text x="262" y="107.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">matter?</text>
<line x1="448" y1="83" x2="480" y2="83" stroke="#6b6a66" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="0.5 5"/>
<line x1="448" y1="93" x2="480" y2="93" stroke="#6b6a66" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="0.5 5"/>
<rect x="488" y="8" width="192" height="160" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<rect x="488" y="8" width="192" height="6" rx="0" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="502" y="42" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Possession</text>
<text x="502" y="60" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">People or property on site</text>
<line x1="502" y1="72" x2="666" y2="72" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="502" y="94" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Who or what is actually on the</text>
<text x="502" y="109.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">land?</text></svg>
