<text x="474" y="36" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Richmond June 2026</text>
<text x="474" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">published table</text>
<text x="474" y="82" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Rows</text>
<text x="474" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">3 sold rows</text>
<text x="474" y="121.6" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Denominator</text>
<text x="474" y="137.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">listed taxes, interest and charges</text>
<text x="474" y="161.2" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Ratios</text>
<text x="474" y="177.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">about 1.33×, 6.59× and 6.28×</text>
<text x="474" y="200.8" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="474" y="216.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">far too few to support a municipal</text>
<text x="474" y="232.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">price rule</text>
<line x1="16" y1="330" x2="656" y2="330" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="16" y="348" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">Cross-municipal numbers are useful only when procedure, sample and denominator travel with them.</text></svg>
