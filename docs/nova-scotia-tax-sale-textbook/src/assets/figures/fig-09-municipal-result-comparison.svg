<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 362" width="672" height="362" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Definitions travel with the numbers</title><desc>Three dated municipal result sets, each with its row count, ratio denominator and completeness limit.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="362" fill="#ffffff"/><rect x="8" y="10" width="208" height="300" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="10" width="6" height="300" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="36" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Inverness 2025</text>
<text x="26" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">May 2025 public result sheet</text>
<text x="26" y="82" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Rows</text>
<text x="26" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">31 published rows; 35 reported</text>
<text x="26" y="113.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">sold</text>
<text x="26" y="137.2" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Denominator</text>
<text x="26" y="153.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">advertised recovery amount</text>
<text x="26" y="176.8" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Median</text>
<text x="26" y="192.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">bid/recovery 4.53×</text>
<text x="26" y="216.4" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Range</text>
<text x="26" y="232.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">approximately the recovery</text>
<text x="26" y="248" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">amount to more than 21×</text>
<text x="26" y="271.6" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Limit</text>
<text x="26" y="287.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">4-row gap left unresolved</text>
<rect x="232" y="10" width="208" height="300" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="232" y="10" width="6" height="300" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="250" y="36" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">CBRM March 2026</text>
<text x="250" y="54" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">official result sheet</text>
<text x="250" y="82" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Rows</text>
<text x="250" y="98" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">24 recorded sales with both a</text>
<text x="250" y="113.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">minimum and a winning bid</text>
<text x="250" y="137.2" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Denominator</text>
<text x="250" y="153.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">minimum bid</text>
<text x="250" y="176.8" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Median</text>
<text x="250" y="192.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">winning/minimum 3.17×</text>
<text x="250" y="216.4" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Range</text>
<text x="250" y="232.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">exactly the minimum to more</text>
<text x="250" y="248" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">than 42×</text>
<text x="250" y="271.6" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Spread</text>
<text x="250" y="287.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">8 at the minimum; 9 at 5× or</text>
<text x="250" y="303.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">more</text>
