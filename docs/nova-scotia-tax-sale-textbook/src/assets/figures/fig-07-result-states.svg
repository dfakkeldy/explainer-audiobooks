<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 360" width="672" height="360" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Three result states</title><desc>Positive, negative and error results and what each note preserves.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="360" fill="#ffffff"/><rect x="454" y="8" width="210" height="48" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="464" y="26" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">A failed service, loading timeout,</text>
<text x="464" y="40.3" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">hidden layer or incorrect selection is</text>
<text x="464" y="54.6" font-size="11" font-weight="400" fill="#1d1c1a" text-anchor="start">not “nothing found”.</text>
<rect x="8" y="66" width="210" height="286" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<path d="M195,86 L198.5,90 L205.5,82" fill="none" stroke="#1f6b6e" stroke-width="2.25" stroke-linejoin="round"/>
<text x="20" y="92" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Positive</text>
<text x="20" y="112" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Feature returned</text>
<text x="20" y="131.6" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The service returned a feature or</text>
<text x="20" y="147.2" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">scenario under the recorded</text>
<text x="20" y="162.8" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">conditions.</text>
<line x1="20" y1="176.4" x2="206" y2="176.4" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="20" y="194.4" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Preserve</text>
<text x="22" y="212.4" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="212.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source</text>
<text x="22" y="230" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="230" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">date</text>
<text x="22" y="247.6" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="247.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">geometry</text>
<text x="22" y="265.2" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="265.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">attributes</text>
<text x="22" y="282.8" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="282.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">coverage limits</text>
<text x="22" y="300.4" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="300.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">positional quality</text>
<text x="22" y="318" font-size="12" font-weight="700" fill="#1f6b6e" text-anchor="start">–</text>
<text x="34" y="318" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">next question</text>
<rect x="231" y="66" width="210" height="286" rx="3" fill="#ffffff" stroke="#6b6a66" stroke-width="1.5"/>
<circle cx="423" cy="86" r="7" fill="none" stroke="#6b6a66" stroke-width="1.5"/>
<line x1="418" y1="91" x2="428" y2="81" stroke="#6b6a66" stroke-width="1.5" stroke-linecap="butt"/>
<text x="243" y="92" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Negative</text>
<text x="243" y="112" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Query completed with no</text>
<text x="243" y="127.6" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">returned feature</text>
<text x="243" y="147.2" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The query completed and returned</text>
<text x="243" y="162.8" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">no feature under those conditions.</text>
<line x1="243" y1="176.4" x2="429" y2="176.4" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="243" y="194.4" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Preserve</text>
<text x="245" y="212.4" font-size="12" font-weight="700" fill="#6b6a66" text-anchor="start">–</text>
<text x="257" y="212.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source</text>
<text x="245" y="230" font-size="12" font-weight="700" fill="#6b6a66" text-anchor="start">–</text>
<text x="257" y="230" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">date</text>
<text x="245" y="247.6" font-size="12" font-weight="700" fill="#6b6a66" text-anchor="start">–</text>
<text x="257" y="247.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">settings</text>
<text x="245" y="265.2" font-size="12" font-weight="700" fill="#6b6a66" text-anchor="start">–</text>
<text x="257" y="265.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">completeness limits</text>
<text x="245" y="282.8" font-size="12" font-weight="700" fill="#6b6a66" text-anchor="start">–</text>
<text x="257" y="282.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the exact narrow concern the</text>
<text x="257" y="298.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">result did not confirm</text>
<rect x="454" y="66" width="210" height="286" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="646" cy="86" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="646" y="90" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="466" y="92" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Error</text>
<text x="466" y="112" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">No reliable result obtained</text>
<text x="466" y="131.6" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The researcher does not have a</text>
<text x="466" y="147.2" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">completed result.</text>
<line x1="466" y1="160.8" x2="652" y2="160.8" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="466" y="178.8" font-size="11" font-weight="700" fill="#4a4843" text-anchor="start">Preserve</text>
<text x="468" y="196.8" font-size="12" font-weight="700" fill="#7a3e6e" text-anchor="start">–</text>
<text x="480" y="196.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the failure</text>
<text x="466" y="228.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Then retry, or use the authoritative</text>
<text x="466" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source directly.</text>
<rect x="464" y="263.6" width="190" height="30" rx="0" fill="#f6e8e3" stroke="none" stroke-width="1.5"/>
<text x="472" y="283.6" font-size="12" font-weight="700" fill="#a33b28" text-anchor="start">Draw no negative conclusion.</text></svg>
