<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 352" width="672" height="352" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>No redemption period does not mean no uncertainty</title><desc>Older-arrears route to the deed stage beside four questions that remain.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f5560" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f5560"/></marker></defs><rect width="672" height="352" fill="#ffffff"/><rect x="8" y="12" width="156" height="112" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="12" width="6" height="112" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="38" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Older arrears</text>
<text x="26" y="60" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Taxes were already in</text>
<text x="26" y="75.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">arrears for more than</text>
<text x="26" y="91.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">six years at sale</text>
<rect x="190" y="12" width="156" height="112" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="204" y="38" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Statutory exception</text>
<text x="204" y="60" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">No six-month</text>
<text x="204" y="75.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">redemption right under</text>
<text x="204" y="91.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">the ordinary route</text>
<rect x="372" y="12" width="156" height="112" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="386" y="38" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Deed stage</text>
<text x="386" y="60" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Purchaser may request</text>
<text x="386" y="75.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and pay for the</text>
<text x="386" y="91.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">municipal deed</text>
<path d="M164,68 L187,68" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<path d="M346,68 L369,68" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f5560)"/>
<rect x="542" y="12" width="122" height="112" rx="3" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="603" y="42" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">“Immediate</text>
<text x="603" y="62" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">deed”</text>
<text x="603" y="86" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">municipal</text>
<text x="603" y="102" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">shorthand</text>
<text x="664" y="148" font-size="12" font-weight="700" fill="#24395a" text-anchor="end">Immediate deed describes timing, not readiness.</text>
<text x="8" y="178" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">The deed route changes. These questions do not disappear:</text>
<rect x="8" y="192" width="153.5" height="96" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="28" cy="213" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="28" y="217" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="42" y="218" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Possession</text>
<text x="22" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Who is lawfully on site?</text>
<rect x="175.5" y="192" width="153.5" height="96" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="195.5" cy="213" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="195.5" y="217" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="209.5" y="218" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Access</text>
<text x="189.5" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What legal rights reach</text>
<text x="189.5" y="259.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">it?</text>
<rect x="343" y="192" width="153.5" height="96" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="363" cy="213" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="363" y="217" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="377" y="218" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Title review</text>
<text x="357" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">What property-specific</text>
<text x="357" y="259.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">issues remain?</text>
<rect x="510.5" y="192" width="153.5" height="96" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="530.5" cy="213" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="530.5" y="217" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="544.5" y="218" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Intended use</text>
<text x="524.5" y="244" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Do planning and site</text>
<text x="524.5" y="259.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">facts support it?</text>
<rect x="8" y="306" width="656" height="36" rx="0" fill="#f6e8e3" stroke="#a33b28" stroke-width="1.5"/>
<text x="336" y="329" font-size="13" font-weight="700" fill="#a33b28" text-anchor="middle">Not instant possession. Not access proof. Not a title opinion. Not development approval.</text></svg>
