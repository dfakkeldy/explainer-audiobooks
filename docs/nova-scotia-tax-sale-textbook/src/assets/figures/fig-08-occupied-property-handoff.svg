<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 262" width="672" height="262" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Observation stops before self-help</title><desc>Lawful exterior observation, public records, then lawyer or tenancy advice; a stop card for self-help.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1d1c1a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1d1c1a"/></marker></defs><rect width="672" height="262" fill="#ffffff"/><rect x="8" y="8" width="200" height="118" rx="3" fill="#ffffff" stroke="#b07d17" stroke-width="1.75" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
<text x="20" y="30" font-size="13" font-weight="700" fill="#4a4843" text-anchor="start">1</text>
<text x="38" y="30" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">Lawful exterior</text>
<text x="38" y="46.9" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">observation</text>
<text x="20" y="73.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Remain off the parcel and avoid</text>
<text x="20" y="89.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">confrontation.</text>
<path d="M210,67 L231,67" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1d1c1a)"/>
<rect x="236" y="8" width="200" height="118" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="1.5"/>
<text x="248" y="30" font-size="13" font-weight="700" fill="#4a4843" text-anchor="start">2</text>
<text x="266" y="30" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Public records</text>
<text x="248" y="56.9" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Preserve only bounded,</text>
<text x="248" y="72.5" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">source-backed facts.</text>
<path d="M438,67 L459,67" fill="none" stroke="#1d1c1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1d1c1a)"/>
<rect x="464" y="8" width="200" height="118" rx="3" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="476" y="30" font-size="13" font-weight="700" fill="#4a4843" text-anchor="start">3</text>
<text x="494" y="30" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">Lawyer / tenancy</text>
<text x="494" y="46.9" font-size="13" font-weight="700" fill="#7a3e6e" text-anchor="start">advice</text>
<circle cx="648" cy="26" r="7" fill="#ffffff" stroke="#7a3e6e" stroke-width="1.5"/>
<text x="648" y="30" font-size="11" font-weight="700" fill="#7a3e6e" text-anchor="middle">?</text>
<text x="476" y="73.8" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Establish the lawful route before</text>
<text x="476" y="89.4" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">contact or entry.</text>
<rect x="8" y="150" width="656" height="96" rx="3" fill="#f6e8e3" stroke="#a33b28" stroke-width="3"/>
<rect x="23" y="178" width="14" height="4" rx="0" fill="#a33b28" stroke="none" stroke-width="1.5"/>
<text x="46" y="185" font-size="18" font-weight="700" fill="#a33b28" text-anchor="start">Stop</text>
<text x="110" y="184" font-size="13" font-weight="700" fill="#1d1c1a" text-anchor="start">No lock change, entry, rent demand or goods handling without authority.</text>
<text x="110" y="210" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Occupancy questions move from observation to legal advice, not to self-help.</text></svg>
