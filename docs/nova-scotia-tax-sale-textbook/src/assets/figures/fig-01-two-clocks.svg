<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 380" width="672" height="380" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>Auction day connects two clocks</title><desc>Municipal collection clock before auction day; purchaser and redemption clock after it.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style><marker id="arrow-1f6b6e" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f6b6e"/></marker><marker id="arrow-24395a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#24395a"/></marker><marker id="arrow-2f5e46" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f5e46"/></marker></defs><rect width="672" height="380" fill="#ffffff"/><text x="8" y="24" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Municipal collection clock</text>
<text x="468" y="24" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Purchaser / redemption clock</text>
<rect x="8" y="40" width="196" height="74" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="40" width="6" height="74" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="64" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Arrears</text>
<text x="26" y="84" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Eligibility and council decisions</text>
<rect x="8" y="140" width="196" height="74" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="140" width="6" height="74" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="164" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Notice</text>
<text x="26" y="184" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Preliminary notice, title search,</text>
<text x="26" y="199.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">sale notice</text>
<rect x="8" y="240" width="196" height="74" rx="3" fill="#ffffff" stroke="#24395a" stroke-width="1.5"/>
<rect x="8" y="240" width="6" height="74" rx="0" fill="#24395a" stroke="none" stroke-width="1.5"/>
<text x="26" y="264" font-size="13" font-weight="700" fill="#24395a" text-anchor="start">Advertise</text>
<text x="26" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">At least 30 consecutive days</text>
<path d="M106,114 L106,137" fill="none" stroke="#24395a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-24395a)"/>
<path d="M106,214 L106,237" fill="none" stroke="#24395a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-24395a)"/>
<rect x="468" y="40" width="196" height="74" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="2"/>
<text x="482" y="64" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Certificate</text>
<text x="482" y="84" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">After full payment</text>
<rect x="468" y="140" width="196" height="74" rx="3" fill="#ffffff" stroke="#1f6b6e" stroke-width="2"/>
<text x="482" y="164" font-size="13" font-weight="700" fill="#1f6b6e" text-anchor="start">Six-month route</text>
<text x="482" y="184" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Possible redemption; protect</text>
<text x="482" y="199.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and insure</text>
<rect x="468" y="240" width="196" height="74" rx="3" fill="#ffffff" stroke="#2f5e46" stroke-width="2"/>
<text x="482" y="264" font-size="13" font-weight="700" fill="#2f5e46" text-anchor="start">Deed stage</text>
<text x="482" y="284" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">If not redeemed, request and</text>
<text x="482" y="299.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">pay for deed</text>
<path d="M566,114 L566,137" fill="none" stroke="#1f6b6e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<path d="M566,214 L566,237" fill="none" stroke="#1f6b6e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<rect x="244" y="70" width="184" height="200" rx="3" fill="#1f5560" stroke="none" stroke-width="1.5"/>
<text x="336" y="110" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Auction day</text>
<text x="336" y="138" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">A hinge,</text>
<text x="336" y="155" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">not a finish line</text>
<line x1="268" y1="180" x2="404" y2="180" stroke="#9db8bf" stroke-width="1" stroke-linecap="butt"/>
<text x="336" y="206" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">Event terms control</text>
<text x="336" y="222" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">payment and</text>
<text x="336" y="238" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">registration details.</text>
<path d="M204,277.0 L226,277.0 L226,250 L241,250" fill="none" stroke="#24395a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-24395a)"/>
<path d="M428,90 L446,90 L446,77.0 L465,77.0" fill="none" stroke="#1f6b6e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-1f6b6e)"/>
<path d="M388,270 L388,287.0 L465,287.0" fill="none" stroke="#2f5e46" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-2f5e46)"/>
<text x="248" y="290" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Older-arrears route: no</text>
<text x="248" y="304.3" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">six-month redemption</text>
<rect x="8" y="338" width="656" height="34" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1.5"/>
<text x="336" y="360" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="middle">The sale ends neither the municipality’s record work nor the purchaser’s legal work.</text></svg>
