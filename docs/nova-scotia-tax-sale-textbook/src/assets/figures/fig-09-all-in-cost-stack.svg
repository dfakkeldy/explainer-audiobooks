<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 436" width="672" height="436" role="img" font-family="'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif"><title>The bid is only the first layer</title><desc>The bid sits above a waterline; tax, legal and registry, survey, insurance, carrying, repair and remediation, possession and the uncertainty reserve sit below it.</desc><defs><style>@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}</style></defs><rect width="672" height="436" fill="#ffffff"/><rect x="16" y="30" width="420" height="34" rx="3" fill="#e6eef0" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="52" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Bid</text>
<text x="184" y="52" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">The amount called or tendered.</text>
<rect x="16" y="90" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="112" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Tax</text>
<text x="184" y="112" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Applicable tax and deed-transfer questions.</text>
<rect x="16" y="128" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="150" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Legal + registry</text>
<text x="184" y="150" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Advice, searches and registration.</text>
<rect x="16" y="166" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="188" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Survey</text>
<text x="184" y="188" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Boundary and access work when needed.</text>
<rect x="16" y="204" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="226" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Insurance</text>
<text x="184" y="226" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Coverage attempts and conditions.</text>
<rect x="16" y="242" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="264" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Carrying</text>
<text x="184" y="264" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">New taxes, security and time.</text>
<rect x="16" y="280" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="302" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Repair / remediation</text>
<text x="184" y="302" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Unknown until appropriately investigated.</text>
<rect x="16" y="318" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="340" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Possession</text>
<text x="184" y="340" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A separate lawful process if occupied.</text>
<rect x="16" y="356" width="420" height="34" rx="3" fill="#ffffff" stroke="#1f5560" stroke-width="1.5"/>
<text x="28" y="378" font-size="13" font-weight="700" fill="#1f5560" text-anchor="start">Uncertainty reserve</text>
<text x="184" y="378" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">A buffer, not hidden optimism.</text>
<path d="M8,76 Q12,72 20,76 T32,76 Q36,72 44,76 T56,76 Q60,72 68,76 T80,76 Q84,72 92,76 T104,76 Q108,72 116,76 T128,76 Q132,72 140,76 T152,76 Q156,72 164,76 T176,76 Q180,72 188,76 T200,76 Q204,72 212,76 T224,76 Q228,72 236,76 T248,76 Q252,72 260,76 T272,76 Q276,72 284,76 T296,76 Q300,72 308,76 T320,76 Q324,72 332,76 T344,76 Q348,72 356,76 T368,76 Q372,72 380,76 T392,76 Q396,72 404,76 T416,76 Q420,72 428,76 T440,76 Q444,72 452,76 T464,76" fill="none" stroke="#9db8bf" stroke-width="1.5" stroke-linejoin="round"/>
<text x="456" y="44" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Visible: the winning bid</text>
<text x="456" y="60" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">the visible tip</text>
<path d="M448,98 L448,390" fill="none" stroke="#1f5560" stroke-width="1.5" stroke-linejoin="round"/>
<text x="456" y="112" font-size="12" font-weight="700" fill="#1d1c1a" text-anchor="start">Below the surface</text>
<text x="456" y="130" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">Known costs should be researched</text>
<text x="456" y="145.6" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">and estimated, not treated as a</text>
<text x="456" y="161.2" font-size="12" font-weight="400" fill="#1d1c1a" text-anchor="start">mysterious mass.</text>
<text x="456" y="186.8" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">Not to scale: the submerged proportion</text>
<text x="456" y="201.1" font-size="11" font-weight="400" fill="#4a4843" text-anchor="start">is not fixed.</text>
<line x1="16" y1="406" x2="656" y2="406" stroke="#cfcac0" stroke-width="0.75" stroke-linecap="butt"/>
<text x="16" y="424" font-size="12" font-weight="400" fill="#4a4843" text-anchor="start">The winning bid is one layer in the acquisition's uncertainty budget.</text></svg>
