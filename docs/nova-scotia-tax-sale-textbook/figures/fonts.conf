<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Preview only: lets rsvg-convert find the book's static font cuts.
     FONTCONFIG_FILE=figures/fonts.conf rsvg-convert -w 1400 in.svg -o /tmp/out.png -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../fonts/static</dir>
</fontconfig>
