- id: fig-all-in-cost
  chapter: 9
  kind: infographic
  caption: "The bid is the first layer of the cost. An all-in budget adds taxes, professional fees, carrying costs, repairs, possession and a reserve for what is still unknown."
  draw: >
    Tall stacked bar (illustrative proportions, no dollar figures): winning bid; possible HST; possible
    provincial non-resident deed transfer tax; legal, registry and survey; carrying costs (new tax bills,
    insurance during the certificate months); safety and security; repairs or remediation; possession
    process; development work; uncertainty reserve. Note: tax-sale deeds are exempt from municipal deed
    transfer tax (MGA s. 109(4)); the Affidavit of Value is still filed.
  facts: [TAX-001, TAX-002, TAX-003]

- id: fig-written-maximum
  chapter: 9
  kind: infographic
  caption: "A written maximum, worked out before the sale: what the land is worth to you for your goal, minus every cost and a reserve for what is still unknown."
  draw: >
    Worksheet card with fill-in lines: A Value to me for my written goal (with the evidence used). B All-in
    costs other than the bid. C Uncertainty reserve for unresolved items. D Payment I can make today and
    within 3 business days. Written maximum = A - B - C, capped by D. Signed and dated before the sale.
  facts: [DATA-001, LAW-006]

- id: fig-auction-vs-tender
  chapter: 10
  kind: infographic
  caption: "Auction and tender: two ways the same statute lets a municipality sell. The current notice says which one, and on what terms."
  draw: >
    Side-by-side. OPEN AUCTION: register in person with photo ID, numbered card, open bidding, highest bid
    wins on the day, pay immediately (recovery amount at least) + balance within 3 business days
    (CBRM, Inverness examples). SEALED TENDER: one written offer in an envelope, deadline, opened after
    close (Kings livestream example), highest acceptable tender wins, council may set an acceptable
    minimum, payment per terms. Shared footer: same statute (MGA s. 141), council consent for tender.
  facts: [LAW-005, LAW-006, OPS-001, OPS-002, OPS-004]

- id: fig-payment-clock
  chapter: 10
  kind: infographic
  caption: "The payment clock at a Nova Scotia tax sale, and what happens when a step is missed."
  draw: >
    Timeline: HAMMER -> immediately: the price, or at least the recovery amount (plus any event fee, e.g.
    Inverness $200 registration) -> within 3 business days: the balance -> certificate of sale. Failure
    branches: no immediate payment -> property re-offered at once; balance missed -> re-advertised and
    resold, resale expenses deducted from the deposit; no sufficient bid -> treasurer may bid for the
    municipality, or re-advertise. Accepted forms list (cash, certified cheque, money order, bank draft,
    irrevocable letter of credit, lawyer's trust cheque; check the event terms).
  facts: [LAW-006, LAW-015, OPS-004]

- id: fig-six-months
  chapter: 11
  kind: infographic
  caption: "The six certificate-holder months: protect the property, insure what can be insured, keep receipts, and stay ready for either redemption or a deed request."
  draw: >
    Six-column calendar strip (Month 1..6) with recurring bands across all months: insure insurable
    buildings; pay new tax bills; keep receipts for repairs the treasurer approved; protect without
    diminishing value (no tree cutting, no damage); check redemption status with the treasurer. Month 1:
    certificate registered; arrange insurance. Month 6 end: redeemed (repaid with 10% a year) or ready to
    request the deed.
  facts: [LAW-007, LAW-008, LAW-010, LAW-011, INS-001]

- id: fig-after-the-deed
  chapter: 12
  kind: infographic
  caption: "After the deed: registration starts a six-year window in which a tax deed can generally be challenged, and the second wave of due diligence begins."
  draw: >
    Multi-year timeline: deed request + fee -> deed registered (vests fee simple free of encumbrances, as
    the statute specifies; easements and rights-of-way continue) -> years 1-6 contestability window
    (Marketable Titles Act s. 6) -> after 6 years generally binding (exceptions: fraud, specific land rule;
    damages claims preserved). Parallel lane: second due diligence: survey, inspection, insurance,
    possession, permits. Parallel lane: surplus account claims (up to 20 years).
  facts: [LAW-012, LAW-014, LAW-017, LAW-018]

- id: fig-surplus-route
  chapter: 12
  kind: infographic
  caption: "Where the money goes: sale proceeds pay the municipality's amounts first; any balance waits in the tax-sale surplus account for people with prior interests to claim through the Supreme Court."
  draw: >
    Flow: purchase money -> taxes, interest, expenses to the municipality -> balance -> tax-sale surplus
    account. If redeemed: the balance reduces the redemption amount. After redemption expires: a person
    with a prior interest applies to the Nova Scotia Supreme Court for a proportional payment, before
    20 years pass. Purchaser does not receive the surplus.
  facts: [LAW-010, LAW-014]

- id: fig-four-buckets
  chapter: 13
  kind: infographic
  caption: "Sort every item in the file into one of four buckets before deciding. A single item in the last bucket ends the bid."
  draw: >
    Four sorting bins: VERIFIED (official, dated source states it). PROFESSIONALLY VERIFIABLE (a named
    professional can confirm before the sale). UNRESOLVED BUT PRICEABLE (open, but the reserve covers it).
    DISQUALIFYING (stop). Arrow out: written go / no-go with the maximum.
  facts: [MAP-001]

- id: fig-research-file
  chapter: 13
  kind: infographic
  caption: "Meadow Line's research file on one page: every line carries a source, a date and a label."
  draw: >
    Filled-in form for fictional composite Meadow Line: Event (municipality, date, lien, recovery amount,
    redemption marker, checked date); Parcel (PID, AAN, legal description reference); Context (road,
    water, planning, hazards); Unknowns with owner (access -> lawyer; boundary -> surveyor; condition ->
    inspector); Decision (go/no-go, written maximum, signed date). Labels from the five-label set.
  facts: [MAP-001]
