- id: fig-research-spine
  chapter: 4
  kind: infographic
  caption: "The research route used throughout this book: notice, parcel, context, unknowns, handoff."
  draw: >
    Five large chevrons. NOTICE: confirm the event, lien, amount, redemption marker, date checked.
    PARCEL: PID, mapped shape, legal description, assessment. CONTEXT: roads, water, aerial, planning,
    hazards, history. UNKNOWNS: list each open question with its owner. HANDOFF: lawyer, surveyor, planner,
    inspector, insurer, accountant; bidder decides.
  facts: [MAP-001, LAND-001, LAND-004, LAND-005, LAND-006]

- id: fig-who-answers
  chapter: 4
  kind: infographic
  caption: "Who answers what. Match each question to the authority or professional that can settle it."
  draw: >
    Two-column matrix. Is the lien still for sale, and on what terms? -> the municipality's current notice /
    treasurer. Which parcel? -> PID, parcel map, registry. Where is the boundary on the ground? -> surveyor.
    What interest will I get; what burdens continue? -> lawyer (title). Can I reach it legally? -> registry
    plans + lawyer. What may I build? -> municipal planner / planning commission. What condition is it in? ->
    inspector (after lawful access). Can I insure it? -> insurer. Tax consequences? -> accountant.
    Who lives there; what rights do they have? -> lawyer / tenancy advice.
  facts: [LAND-004, LAND-005, LAND-006, INS-001, OCC-001, TAX-001]

- id: fig-evidence-labels
  chapter: 4
  kind: infographic
  caption: "Five labels that keep a research file honest. Every entry gets one."
  draw: >
    Five labelled badges with one-line meaning and an example: Verified record (an official source states
    it, with date); Screening clue (a map or layer suggests something worth asking); Visual interpretation
    (what an image appears to show); Professional verification needed (a qualified person must confirm);
    No-go until resolved (a question that stops the bid).
  facts: [MAP-001]

