- id: fig-layer-questions
  chapter: 5
  kind: infographic
  caption: "One layer, one question. Each map layer is a prompt for a specific record or professional."
  draw: >
    Table-like graphic, one row per layer with icon: Parcel outline -> which parcel; confirm with legal
    description, survey. Aerial photo -> what was visible on the image date; confirm on site from public
    land, inspection after lawful access. Roads -> is there a public road; legal access from registry +
    lawyer. Water -> watercourse or coast; setbacks from planner, Nova Scotia Environment. Flood study ->
    mapped hazard where studied; planner, insurer. Geology / mines -> recorded mineral occurrences or
    abandoned mine openings; provincial records, professional advice. Buildings + assessment -> mapped
    footprint and dated assessment; inspection. Historical results -> past event record; current notice.
  facts: [MAP-001, MAP-002, MAP-003, MAP-004, MAP-005, MAP-006, MAP-007, ENV-005]

- id: fig-access-plan
  chapter: 6
  kind: infographic
  caption: "Physical access and legal access can differ. One parcel fronts the road; another is reached by a registered right-of-way; a driveway in use may cross a neighbour's land with no registered right; a parcel behind the others may have no way in at all."
  draw: >
    Plan view (bird's-eye) of four parcels and a public road. Parcel A fronts the road (legal frontage).
    Parcel B reached by a worn driveway across parcel C with no registered right-of-way (question mark).
    Parcel D reached by a registered right-of-way strip (solid). Parcel E landlocked behind. Legend:
    public road; registered right-of-way; driveway in use; parcel line. Labels plain.
  facts: [LAND-005]

- id: fig-can-it-do-the-job
  chapter: 6
  kind: infographic
  caption: "Can the land do the job? Write the intended use first, then test it against each layer of municipal and provincial rules."
  draw: >
    Vertical funnel / ladder: 1 Write the goal (cabin, year-round home, woodlot, storage). 2 Zoning and
    land-use by-law (current; Plan Inverness in force Sept 11 2025, EDPC). 3 Lot rules: frontage, lot
    size, setbacks. 4 Servicing: well, on-site sewage approval. 5 Building, fire and by-law orders
    (municipal clearance). 6 Permits. Result: buildable for this goal / not yet known / no.
  facts: [LAND-006, LAND-008, ENV-002, ENV-003]

- id: fig-search-beam
  chapter: 7
  kind: infographic
  caption: "A records search lights up one record type, one place and one date range. Everything outside the beam is still unknown."
  draw: >
    Flashlight beam over a stylized map grid. Inside beam: "Searched: contaminated-sites register, this PID,
    2000-2026 -> no match". Outside beam (darker): other record types, older dates, neighbouring parcels,
    things never recorded. Caption-like label: "No match = no match in this search."
  facts: [ENV-001]

- id: fig-environment-records
  chapter: 7
  kind: infographic
  caption: "Records worth checking for what may be on, in or under the land, and who keeps each one."
  draw: >
    Icon grid, six tiles: Contaminated sites (Nova Scotia Environment). Wells (well logs). On-site sewage
    (approval records). Coast and flooding (flood studies, coastal protection rules). Abandoned mine
    openings and mineral occurrences (provincial mine records). Buildings and fuel tanks (inspection,
    municipal records). Each tile: what it can show; who to ask next.
  facts: [ENV-001, ENV-002, ENV-003, ENV-004, ENV-005]

- id: fig-three-questions
  chapter: 8
  kind: infographic
  caption: "Three separate questions about the same land: what interest the deed gives, what burdens continue, and who is in possession."
  draw: >
    Three parallel lanes. TITLE: what interest the tax deed vests (fee simple, free of encumbrances as the
    statute specifies) -> lawyer. BURDENS: easements and rights-of-way that continue; other statutory
    questions -> lawyer, registry. POSSESSION: who lives on or uses the land; tenancy; mobile homes ->
    lawyer, tenancy advice. Each lane its own colour.
  facts: [LAW-012, OCC-001, MOB-001]

- id: fig-occupied-handoff
  chapter: 8
  kind: infographic
  caption: "If the property looks occupied: observe from public land, record what you saw, and take the question to a lawyer before any contact or action."
  draw: >
    Three-step flow with a stop sign: 1 Observe from a public road (vehicles, smoke, mail, lights) and
    record date. 2 STOP: no entry, no notes on doors, no self-help. 3 Hand off: lawyer or tenancy advice
    on possession and notice. Side: the municipality cannot authorize entry before the sale.
  facts: [LAND-007, OCC-001, LAW-008]

