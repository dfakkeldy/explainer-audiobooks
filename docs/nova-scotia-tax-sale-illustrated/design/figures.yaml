- id: fig-process-timeline
  chapter: 1
  kind: infographic
  caption: "The whole process on one line. Everything left of the sale belongs to the municipality's collection file; everything right of it belongs to the purchaser's certificate and deed."
  draw: >
    Horizontal timeline, two clocks meeting at SALE DAY. Before: taxes unpaid (first lien, ranks ahead
    of other claims, need not be registered) -> eligible after June 30 of the following year; must be put up
    for sale after 3 fiscal years of arrears (subject to exceptions, council deferral) -> preliminary
    notice, at least 14 days to pay -> title search, possible survey -> notice of intent, 60 days to pay ->
    public notice at least 30 consecutive days -> SALE (auction, or tender with council consent).
    After: immediate payment, balance within 3 business days -> certificate of sale (registered) ->
    6-month redemption window (redeemable files) -> deed request -> deed registered -> 6-year window to set
    aside runs from registration (Marketable Titles Act). Mark the older-than-six-years arrears branch
    that skips the 6-month window.
  facts: [LAW-001, LAW-002, LAW-003, LAW-004, LAW-005, LAW-006, LAW-007, LAW-009, LAW-012, LAW-018]

- id: fig-who-gets-notice
  chapter: 1
  kind: infographic
  caption: "Who is in the story before a bidder arrives: the owner and anyone with a registered interest receive notices; occupants, heirs and neighbours may be affected too."
  draw: >
    Concentric or left-to-right ring: centre the parcel. Ring 1 people served notice: assessed owner,
    mortgage holders, lien and charge holders (found by the title search). Ring 2 people affected:
    occupants or tenants, heirs, neighbours. Treasurer runs the process. Bidder enters last, at the edge,
    after the 30-day public notice.
  facts: [LAW-003, LAW-004, OCC-001]

- id: fig-one-law-many-events
  chapter: 1
  kind: infographic
  caption: "One provincial framework, many local events. The Municipal Government Act sets the rules for most municipalities; Halifax follows its own Charter. Each municipality's current notice sets the event."
  draw: >
    Left: two statute blocks (Municipal Government Act; Halifax Regional Municipality Charter). Right: dated
    municipal examples with method icons: Inverness open auction (Aug 11 2026, Port Hood); Richmond open
    auction (June 12 2026); Pictou sealed tender (April 2026); Annapolis March 2026 tax sale, then a June 2026 sale by tender;
    Halifax sealed tender (Sept 15 2026); Victoria sealed tender (Sept 14 2026); Chester: no
    2026 sale. Footer: examples dated; check the current notice.
  facts: [LAW-005, OPS-005, OPS-007]

- id: fig-packet-anatomy
  chapter: 2
  kind: infographic
  caption: "Anatomy of a tax-sale entry (fictional Harbour Road). Each field comes from a different record system and answers a different question."
  draw: >
    Mock packet row and detail sheet for fictional Harbour Road (no real owner): lien number 12, AAN 0123 4567,
    PID ending 421, location Harbour Road, land and building assessment, recovery amount $4,000, redeemable
    YES, aerial with parcel overlay, legal description block. Callouts: lien no. = this event's label;
    AAN = assessment account (PVSC); PID = mapped parcel (land registry); location = orientation;
    assessment = taxation record; recovery amount = taxes + interest + expenses being collected;
    redemption marker = which post-sale path; legal description = registry words a lawyer reads.
  facts: [LAND-001, LAND-002, LAND-003, DATA-005]

- id: fig-which-key
  chapter: 2
  kind: infographic
  caption: "Three handles, three record systems. Pick the key that matches the question."
  draw: >
    Three rows: AAN -> assessment roll (Property Valuation Services Corporation) -> answers assessed value,
    classification, tax account. PID -> parcel map and land registry (Property Online) -> answers which mapped
    parcel, registered documents. Civic address -> civic addressing / emergency location -> answers where
    on the ground to orient. A fourth row: lien number -> this sale's list only.
  facts: [LAND-001, LAND-002, LAND-003]

