- id: fig-redemption-paths
  chapter: 3
  kind: infographic
  caption: "Two paths after the hammer. Most files carry a six-month redemption right; files with taxes more than six years in arrears at the sale can go to deed without it."
  draw: >
    Decision tree from SALE: question "Taxes more than six years in arrears at the time of sale?" NO ->
    certificate of sale -> six-month redemption window -> (a) redeemed: purchaser repaid under the
    statutory formula, rights end; (b) not redeemed: purchaser may request the deed. YES -> no six-month
    right -> deed request. Both deed branches -> deed registered.
  facts: [LAW-007, LAW-009, LAW-011, LAW-012]

- id: fig-redemption-price
  chapter: 3
  kind: infographic
  caption: "What a redemption payment generally includes under the statute: the purchase money plus 10% a year, certain taxes, the registry fee, qualifying insurance premiums and approved repairs, adjusted for surplus and income from the property."
  draw: >
    Stacked block / receipt-style breakdown: purchase sum; + 10% annual interest from sale to redemption;
    + specified taxes; + registry fee; + qualifying fire-insurance premiums; + repair costs the treasurer
    approved; adjustments: surplus, income the purchaser received from the property. Note: unapproved
    repairs are at the purchaser's risk.
  facts: [LAW-010, LAW-011]

