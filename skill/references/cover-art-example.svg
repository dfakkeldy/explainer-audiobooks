<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400">
  <defs>
    <linearGradient id="aaBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0a1a36"/>
      <stop offset="1" stop-color="#0b2249"/>
    </linearGradient>
    <pattern id="aaGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#bcd8ff" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="aaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="1400" fill="url(#aaBg)"/>
  <rect x="0" y="0" width="1200" height="1400" fill="url(#aaGrid)"/>

  <!-- ===== the phone being built ===== -->
  <!-- body -->
  <rect x="430" y="300" width="340" height="800" rx="48" fill="#0c2552" stroke="#bcd8ff" stroke-width="6"/>
  <rect x="558" y="330" width="84" height="12" rx="6" fill="#bcd8ff" fill-opacity="0.5"/>
  <rect x="452" y="372" width="296" height="690" rx="28" fill="#102a55"/>

  <!-- finished top half: solid UI -->
  <rect x="478" y="402" width="244" height="44" rx="12" fill="#bcd8ff" fill-opacity="0.85"/>
  <circle cx="512" cy="500" r="30" fill="#ffb454"/>
  <rect x="558" y="482" width="150" height="16" rx="8" fill="#e7f0ff" fill-opacity="0.85"/>
  <rect x="558" y="512" width="104" height="14" rx="7" fill="#9db8e6" fill-opacity="0.7"/>
  <rect x="478" y="558" width="244" height="118" rx="18" fill="#14376b" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="500" y="612" width="126" height="36" rx="18" fill="#ffb454"/>

  <!-- build line -->
  <line x1="452" y1="706" x2="748" y2="706" stroke="#ffb454" stroke-width="4" stroke-dasharray="16 11"/>

  <!-- under-construction bottom half: wireframe -->
  <circle cx="512" cy="792" r="30" fill="none" stroke="#7fa8e0" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="558" y="774" width="150" height="16" rx="8" fill="none" stroke="#7fa8e0" stroke-width="2.5" stroke-dasharray="8 7"/>
  <rect x="558" y="804" width="104" height="14" rx="7" fill="none" stroke="#7fa8e0" stroke-width="2.5" stroke-dasharray="8 7"/>
  <rect x="478" y="858" width="244" height="118" rx="18" fill="none" stroke="#7fa8e0" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="478" y="1000" width="244" height="34" rx="17" fill="none" stroke="#7fa8e0" stroke-width="2.5" stroke-dasharray="10 8"/>

  <!-- ===== tower crane ===== -->
  <!-- mast -->
  <rect x="868" y="210" width="22" height="906" fill="none" stroke="#bcd8ff" stroke-width="4" stroke-opacity="0.85"/>
  <line x1="868" y1="210" x2="890" y2="310" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="890" y1="210" x2="868" y2="310" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="868" y1="410" x2="890" y2="510" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="890" y1="410" x2="868" y2="510" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="868" y1="610" x2="890" y2="710" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="890" y1="610" x2="868" y2="710" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="868" y1="810" x2="890" y2="910" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="890" y1="810" x2="868" y2="910" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- jib + counter-jib -->
  <line x1="470" y1="236" x2="1000" y2="236" stroke="#bcd8ff" stroke-width="4"/>
  <line x1="470" y1="258" x2="1000" y2="258" stroke="#bcd8ff" stroke-width="4"/>
  <line x1="470" y1="236" x2="560" y2="258" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="600" y1="236" x2="690" y2="258" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="730" y1="236" x2="820" y2="258" stroke="#bcd8ff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- apex + tie cables -->
  <path d="M879 150 L470 236 M879 150 L1000 236" fill="none" stroke="#bcd8ff" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="879" y1="150" x2="879" y2="210" stroke="#bcd8ff" stroke-width="4"/>
  <!-- counterweight -->
  <rect x="958" y="262" width="60" height="44" rx="6" fill="#bcd8ff" fill-opacity="0.4"/>

  <!-- hoist cable + the glowing block being lowered onto the build line -->
  <line x1="560" y1="258" x2="560" y2="648" stroke="#bcd8ff" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="560" cy="688" r="78" fill="url(#aaGlow)"/>
  <rect x="516" y="652" width="88" height="64" rx="12" fill="#ffb454" stroke="#ffe2b3" stroke-width="2.5"/>
  <rect x="536" y="676" width="48" height="9" rx="4.5" fill="#7a3e00" fill-opacity="0.6"/>
  <circle cx="470" cy="640" r="5" fill="#ffd9a0" fill-opacity="0.9"/>
  <circle cx="648" cy="700" r="4" fill="#ffd9a0" fill-opacity="0.8"/>
  <circle cx="612" cy="612" r="3.5" fill="#ffd9a0" fill-opacity="0.7"/>

  <!-- ===== the architect at the drafting board (bottom-left) ===== -->
  <!-- drafting board on an A-frame -->
  <path d="M150 1180 L330 1110 L356 1150 L176 1224 Z" fill="#0e2a55" stroke="#bcd8ff" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="210" y1="1196" x2="300" y2="1160" stroke="#7fa8e0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="222" y1="1210" x2="312" y2="1174" stroke="#7fa8e0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="196" y1="1208" x2="196" y2="1300" stroke="#bcd8ff" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="320" y1="1150" x2="332" y2="1300" stroke="#bcd8ff" stroke-width="4" stroke-opacity="0.7"/>

  <!-- figure: head, torso, arm raised toward the build -->
  <circle cx="150" cy="1010" r="30" fill="#cfe0ff"/>
  <path d="M120 1060 Q150 1044 180 1060 L196 1180 L104 1180 Z" fill="#cfe0ff"/>
  <path d="M178 1074 L286 1006" fill="none" stroke="#cfe0ff" stroke-width="20" stroke-linecap="round"/>

  <!-- drafting compass motif (bottom-right) -->
  <circle cx="1040" cy="1150" r="9" fill="none" stroke="#ffb454" stroke-width="4"/>
  <line x1="1040" y1="1158" x2="1004" y2="1258" stroke="#ffb454" stroke-width="5" stroke-linecap="round"/>
  <line x1="1040" y1="1158" x2="1082" y2="1256" stroke="#ffb454" stroke-width="5" stroke-linecap="round"/>
  <line x1="1082" y1="1256" x2="1074" y2="1232" stroke="#ffb454" stroke-width="5" stroke-linecap="round"/>
</svg>
